  <script>
    /**
     * Predator-Prey Ecosystem Simulation
     * Demonstrates cyclic population dynamics between rabbits (prey) and foxes (predators)
     *
     * Features:
     * - Day/Night cycle affecting behavior
     * - Food growth in dedicated grazing area for rabbits
     * - Burrow system for rabbits (shelter)
     * - Reproduction cycles: Rabbits every 15 days, Foxes every 25 days
     * - Starvation mechanics: Rabbits die after 2 days without food, Foxes after 4 days
     * - Population graph showing cyclic predator-prey dynamics
     */

    const params = {
      rabbitCount: 20,
      foxCount: 5,
      dayLength: 10, // seconds
      foodGrowthRate: 1.0,
      rabbitSpeed: 2.0,
      foxSpeed: 2.5,
      foxVisionRange: 150,
      rabbitReproductionDays: 15,
      foxReproductionDays: 25,
      rabbitStarvationDays: 2,
      foxStarvationDays: 4
    };

    // Time tracking
    let simulationTime = 0; // Total time in seconds
    let currentDay = 0;
    let isDaytime = true;

    // Arrays to hold simulation entities
    let rabbits = [];
    let foxes = [];
    let foodItems = [];
    let burrows = [];

    // Population history for graphing
    let populationHistory = {
      days: [],
      rabbitPop: [],
      foxPop: []
    };

    // Food growing area (top portion of canvas)
    let foodArea = { x: 0, y: 0, width: 0, height: 0 };

    // Mobile detection
    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
    }

    // Burrow class - safe zones for rabbits
    class Burrow {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 25;
      }

      draw(ctx) {
        // Draw burrow entrance
        ctx.fillStyle = '#4a3520';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#2a1510';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();

        // Burrow highlight
        ctx.strokeStyle = 'rgba(100, 70, 40, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();
      }

      contains(x, y) {
        const dx = x - this.x;
        const dy = y - this.y;
        return Math.sqrt(dx * dx + dy * dy) < this.radius;
      }
    }

    // Food class - grows in food area
    class Food {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.eaten = false;
      }

      draw(ctx) {
        if (!this.eaten) {
          ctx.fillStyle = '#88ff44';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();

          // Highlight
          ctx.fillStyle = 'rgba(200, 255, 100, 0.6)';
          ctx.beginPath();
          ctx.arc(this.x - 1, this.y - 1, this.radius * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Rabbit class (prey)
    class Rabbit {
      constructor(x, y, currentDay) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = 6;
        this.speed = params.rabbitSpeed;
        this.angle = Math.random() * Math.PI * 2;

        // Survival mechanics
        this.daysSinceLastMeal = 0; // Track days without eating
        this.lastMealDay = currentDay; // Day of last meal
        this.birthDay = currentDay;
        this.lastReproductionDay = currentDay;
        this.dead = false;

        // Behavior state
        this.inBurrow = false;
      }

      update(canvas, dt) {
        if (this.dead) return;

        // Check for nearby foxes
        let nearestFox = null;
        let nearestFoxDist = Infinity;

        for (const fox of foxes) {
          if (fox.dead) continue;
          const dx = fox.x - this.x;
          const dy = fox.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 150 && dist < nearestFoxDist) {
            nearestFox = fox;
            nearestFoxDist = dist;
          }
        }

        // Behavior: flee from fox or seek food
        if (nearestFox && nearestFoxDist < 120) {
          // FLEE! Run to nearest burrow
          if (burrows.length > 0) {
            let nearestBurrow = burrows[0];
            let minDist = Infinity;
            for (const burrow of burrows) {
              const dist = Math.sqrt(Math.pow(burrow.x - this.x, 2) + Math.pow(burrow.y - this.y, 2));
              if (dist < minDist) {
                minDist = dist;
                nearestBurrow = burrow;
              }
            }

            const dx = nearestBurrow.x - this.x;
            const dy = nearestBurrow.y - this.y;
            this.angle = Math.atan2(dy, dx);
          } else {
            // Just run away from fox
            const dx = this.x - nearestFox.x;
            const dy = this.y - nearestFox.y;
            this.angle = Math.atan2(dy, dx);
          }

          this.speed = params.rabbitSpeed * 2.5; // Run fast when scared!
        } else {
          this.speed = params.rabbitSpeed;

          // Seek food - rabbits always need to eat
          let nearestFood = null;
          let minDist = Infinity;

          for (const food of foodItems) {
            if (food.eaten) continue;
            const dist = Math.sqrt(Math.pow(food.x - this.x, 2) + Math.pow(food.y - this.y, 2));
            if (dist < minDist && dist < 300) {
              minDist = dist;
              nearestFood = food;
            }
          }

          if (nearestFood) {
            // Go to nearest food
            const dx = nearestFood.x - this.x;
            const dy = nearestFood.y - this.y;
            this.angle = Math.atan2(dy, dx);
          } else {
            // Wander toward food growing area
            const centerX = foodArea.x + foodArea.width / 2;
            const centerY = foodArea.y + foodArea.height / 2;
            const dx = centerX - this.x;
            const dy = centerY - this.y;
            this.angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.8;
          }
        }

        // Move
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.x += this.vx;
        this.y += this.vy;

        // Boundary collision
        if (this.x < this.radius) {
          this.x = this.radius;
          this.angle = Math.PI - this.angle;
        }
        if (this.x > canvas.width - this.radius) {
          this.x = canvas.width - this.radius;
          this.angle = Math.PI - this.angle;
        }
        if (this.y < this.radius) {
          this.y = this.radius;
          this.angle = -this.angle;
        }
        if (this.y > canvas.height - this.radius) {
          this.y = canvas.height - this.radius;
          this.angle = -this.angle;
        }

        // Check for food consumption
        for (const food of foodItems) {
          if (food.eaten) continue;
          const dist = Math.sqrt(Math.pow(food.x - this.x, 2) + Math.pow(food.y - this.y, 2));
          if (dist < this.radius + food.radius + 2) {
            food.eaten = true;
            this.lastMealDay = currentDay;
            this.daysSinceLastMeal = 0;
          }
        }

        // Check if in burrow (protection from foxes)
        this.inBurrow = false;
        for (const burrow of burrows) {
          if (burrow.contains(this.x, this.y)) {
            this.inBurrow = true;
            break;
          }
        }
      }

      draw(ctx) {
        if (this.dead) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Rabbit body
        ctx.fillStyle = '#88ff88';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius * 1.2, this.radius * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Rabbit head
        ctx.beginPath();
        ctx.arc(this.radius * 0.8, 0, this.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        ctx.fillStyle = '#66dd66';
        ctx.beginPath();
        ctx.ellipse(this.radius * 1.2, -this.radius * 0.5, this.radius * 0.3, this.radius * 0.8, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(this.radius * 1.2, this.radius * 0.5, this.radius * 0.3, this.radius * 0.8, 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Tail
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-this.radius * 0.9, 0, this.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Fox class (predator)
    class Fox {
      constructor(x, y, currentDay) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = 8;
        this.speed = params.foxSpeed;
        this.angle = Math.random() * Math.PI * 2;

        // Survival mechanics
        this.daysSinceLastMeal = 0; // Track days without eating
        this.lastMealDay = currentDay; // Day of last meal
        this.birthDay = currentDay;
        this.lastReproductionDay = currentDay;
        this.dead = false;

        // Hunting
        this.targetRabbit = null;
      }

      update(canvas, dt) {
        if (this.dead) return;

        // Hunt for rabbits (can't catch rabbits in burrows)
        let nearestRabbit = null;
        let nearestDist = Infinity;

        for (const rabbit of rabbits) {
          if (rabbit.dead || rabbit.inBurrow) continue;

          const dx = rabbit.x - this.x;
          const dy = rabbit.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < params.foxVisionRange && dist < nearestDist) {
            nearestRabbit = rabbit;
            nearestDist = dist;
          }
        }

        if (nearestRabbit) {
          // Chase rabbit
          const dx = nearestRabbit.x - this.x;
          const dy = nearestRabbit.y - this.y;
          this.angle = Math.atan2(dy, dx);
          this.targetRabbit = nearestRabbit;

          // Catch rabbit if close enough
          if (nearestDist < this.radius + nearestRabbit.radius + 3) {
            nearestRabbit.dead = true;
            this.lastMealDay = currentDay;
            this.daysSinceLastMeal = 0;
          }
        } else {
          // Wander looking for prey
          this.angle += (Math.random() - 0.5) * 0.3;
          this.targetRabbit = null;
        }

        // Move
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.x += this.vx;
        this.y += this.vy;

        // Boundary collision
        if (this.x < this.radius) {
          this.x = this.radius;
          this.angle = Math.PI - this.angle;
        }
        if (this.x > canvas.width - this.radius) {
          this.x = canvas.width - this.radius;
          this.angle = Math.PI - this.angle;
        }
        if (this.y < this.radius) {
          this.y = this.radius;
          this.angle = -this.angle;
        }
        if (this.y > canvas.height - this.radius) {
          this.y = canvas.height - this.radius;
          this.angle = -this.angle;
        }
      }

      draw(ctx) {
        if (this.dead) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Fox body
        ctx.fillStyle = '#ff8844';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.radius * 1.3, this.radius * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();

        // Fox head
        ctx.beginPath();
        ctx.arc(this.radius * 1.0, 0, this.radius * 0.7, 0, Math.PI * 2);
        ctx.fill();

        // Ears
        ctx.fillStyle = '#dd6622';
        ctx.beginPath();
        ctx.moveTo(this.radius * 1.3, -this.radius * 0.5);
        ctx.lineTo(this.radius * 1.6, -this.radius * 0.9);
        ctx.lineTo(this.radius * 1.1, -this.radius * 0.4);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(this.radius * 1.3, this.radius * 0.5);
        ctx.lineTo(this.radius * 1.6, this.radius * 0.9);
        ctx.lineTo(this.radius * 1.1, this.radius * 0.4);
        ctx.fill();

        // Tail
        ctx.fillStyle = '#ff6622';
        ctx.beginPath();
        ctx.ellipse(-this.radius * 1.2, 0, this.radius * 0.8, this.radius * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Tail tip (white)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-this.radius * 1.8, 0, this.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function initSimulation(canvas) {
      rabbits = [];
      foxes = [];
      foodItems = [];
      burrows = [];
      simulationTime = 0;
      currentDay = 0;
      isDaytime = true;
      populationHistory = { days: [], rabbitPop: [], foxPop: [] };

      // Define food growing area (top 40% of canvas)
      foodArea = {
        x: 50,
        y: 50,
        width: canvas.width - 100,
        height: canvas.height * 0.4
      };

      // Create burrows in bottom area
      const burrowCount = 3;
      for (let i = 0; i < burrowCount; i++) {
        const x = (canvas.width / (burrowCount + 1)) * (i + 1);
        const y = canvas.height * 0.75 + Math.random() * canvas.height * 0.15;
        burrows.push(new Burrow(x, y));
      }

      // Create initial rabbits near burrows
      for (let i = 0; i < params.rabbitCount; i++) {
        const burrow = burrows[i % burrows.length];
        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 50;
        const x = burrow.x + Math.cos(angle) * dist;
        const y = burrow.y + Math.sin(angle) * dist;
        rabbits.push(new Rabbit(x, y, currentDay));
      }

      // Create initial foxes randomly
      for (let i = 0; i < params.foxCount; i++) {
        const x = 100 + Math.random() * (canvas.width - 200);
        const y = 100 + Math.random() * (canvas.height - 200);
        foxes.push(new Fox(x, y, currentDay));
      }

      // Initial food spread throughout the food area
      spawnFood(80);

      // Record initial population
      populationHistory.days.push(0);
      populationHistory.rabbitPop.push(params.rabbitCount);
      populationHistory.foxPop.push(params.foxCount);
    }

    function spawnFood(count) {
      for (let i = 0; i < count; i++) {
        const x = foodArea.x + Math.random() * foodArea.width;
        const y = foodArea.y + Math.random() * foodArea.height;
        foodItems.push(new Food(x, y));
      }
    }

    function updateDayNightCycle(dt) {
      simulationTime += dt;
      const newDay = Math.floor(simulationTime / params.dayLength);

      // DAY TRANSITION - happens at end of each day
      if (newDay > currentDay) {
        currentDay = newDay;

        // Update all rabbits at end of day
        for (const rabbit of rabbits) {
          if (rabbit.dead) continue;

          // Calculate days since last meal
          rabbit.daysSinceLastMeal = currentDay - rabbit.lastMealDay;

          // STARVATION CHECK: Rabbits die after 2 days without food
          if (rabbit.daysSinceLastMeal >= params.rabbitStarvationDays) {
            rabbit.dead = true;
            continue;
          }

          // REPRODUCTION CHECK: Every 15 days
          const daysSinceReproduction = currentDay - rabbit.lastReproductionDay;
          if (daysSinceReproduction >= params.rabbitReproductionDays) {
            const liveRabbits = rabbits.filter(r => !r.dead).length;
            if (liveRabbits < 150) {
              rabbit.lastReproductionDay = currentDay;
              // Spawn new rabbit near parent
              const newRabbit = new Rabbit(
                rabbit.x + (Math.random() - 0.5) * 40,
                rabbit.y + (Math.random() - 0.5) * 40,
                currentDay
              );
              rabbits.push(newRabbit);
            }
          }
        }

        // Update all foxes at end of day
        for (const fox of foxes) {
          if (fox.dead) continue;

          // Calculate days since last meal
          fox.daysSinceLastMeal = currentDay - fox.lastMealDay;

          // STARVATION CHECK: Foxes die after 4 days without food
          if (fox.daysSinceLastMeal >= params.foxStarvationDays) {
            fox.dead = true;
            continue;
          }

          // REPRODUCTION CHECK: Every 25 days (and only if well-fed)
          const daysSinceReproduction = currentDay - fox.lastReproductionDay;
          if (daysSinceReproduction >= params.foxReproductionDays && fox.daysSinceLastMeal < 2) {
            const liveFoxes = foxes.filter(f => !f.dead).length;
            if (liveFoxes < 40) {
              fox.lastReproductionDay = currentDay;
              // Spawn new fox near parent
              const newFox = new Fox(
                fox.x + (Math.random() - 0.5) * 40,
                fox.y + (Math.random() - 0.5) * 40,
                currentDay
              );
              foxes.push(newFox);
            }
          }
        }

        // Record population at end of day
        const rabbitCount = rabbits.filter(r => !r.dead).length;
        const foxCount = foxes.filter(f => !f.dead).length;
        populationHistory.days.push(currentDay);
        populationHistory.rabbitPop.push(rabbitCount);
        populationHistory.foxPop.push(foxCount);

        // Keep only last 100 data points
        if (populationHistory.days.length > 100) {
          populationHistory.days.shift();
          populationHistory.rabbitPop.shift();
          populationHistory.foxPop.shift();
        }

        console.log(`Day ${currentDay}: Rabbits=${rabbitCount}, Foxes=${foxCount}`);
      }

      // Day/night toggle (cosmetic - affects background)
      const dayProgress = (simulationTime % params.dayLength) / params.dayLength;
      isDaytime = dayProgress < 0.5;

      // Grow food continuously in the food area (spread out growth)
      const foodGrowthChance = 0.03 * params.foodGrowthRate;
      if (Math.random() < foodGrowthChance && foodItems.filter(f => !f.eaten).length < 300) {
        spawnFood(1);
      }

      // Remove eaten food to save memory
      foodItems = foodItems.filter(f => !f.eaten);
    }

    const Simulation = {
      canvas: null,
      ctx: null,
      graphCanvas: null,
      graphCtx: null,
      isPaused: true,
      lastTime: 0,

      init(canvasElement, graphElement) {
        this.canvas = canvasElement;
        this.ctx = this.canvas.getContext('2d');
        this.graphCanvas = graphElement;
        this.graphCtx = this.graphCanvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        initSimulation(this.canvas);
        this.lastTime = performance.now();
        this.animate();
      },

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;

        const graphRect = this.graphCanvas.parentElement.getBoundingClientRect();
        this.graphCanvas.width = graphRect.width;
        this.graphCanvas.height = graphRect.height;
      },

      animate() {
        requestAnimationFrame(() => this.animate());
        const currentTime = performance.now();
        const deltaTime = (currentTime - this.lastTime) / 1000;
        this.lastTime = currentTime;

        if (!this.isPaused) {
          this.update(deltaTime);
        }
        this.draw();
        this.drawGraph();
        this.updateStats();
      },

      update(dt) {
        updateDayNightCycle(dt);

        for (const rabbit of rabbits) {
          rabbit.update(this.canvas, dt);
        }

        for (const fox of foxes) {
          fox.update(this.canvas, dt);
        }
      },

      draw() {
        // Background based on day/night
        const bgColor = isDaytime ? '#2a3a2a' : '#1a1a2e';
        this.ctx.fillStyle = bgColor;
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw food growing area
        this.ctx.fillStyle = 'rgba(100, 150, 60, 0.2)';
        this.ctx.fillRect(foodArea.x, foodArea.y, foodArea.width, foodArea.height);
        this.ctx.strokeStyle = 'rgba(100, 150, 60, 0.5)';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(foodArea.x, foodArea.y, foodArea.width, foodArea.height);

        // Draw burrows
        for (const burrow of burrows) {
          burrow.draw(this.ctx);
        }

        // Draw food
        for (const food of foodItems) {
          food.draw(this.ctx);
        }

        // Draw rabbits
        for (const rabbit of rabbits) {
          rabbit.draw(this.ctx);
        }

        // Draw foxes
        for (const fox of foxes) {
          fox.draw(this.ctx);
        }
      },

      drawGraph() {
        const w = this.graphCanvas.width;
        const h = this.graphCanvas.height;

        this.graphCtx.clearRect(0, 0, w, h);

        if (populationHistory.days.length < 2) return;

        const maxPop = Math.max(
          ...populationHistory.rabbitPop,
          ...populationHistory.foxPop,
          10
        );

        // Draw rabbit population
        this.graphCtx.strokeStyle = '#88ff88';
        this.graphCtx.lineWidth = 2;
        this.graphCtx.beginPath();
        for (let i = 0; i < populationHistory.days.length; i++) {
          const x = (i / (populationHistory.days.length - 1)) * w;
          const y = h - (populationHistory.rabbitPop[i] / maxPop) * h;
          if (i === 0) {
            this.graphCtx.moveTo(x, y);
          } else {
            this.graphCtx.lineTo(x, y);
          }
        }
        this.graphCtx.stroke();

        // Draw fox population
        this.graphCtx.strokeStyle = '#ff8844';
        this.graphCtx.lineWidth = 2;
        this.graphCtx.beginPath();
        for (let i = 0; i < populationHistory.days.length; i++) {
          const x = (i / (populationHistory.days.length - 1)) * w;
          const y = h - (populationHistory.foxPop[i] / maxPop) * h;
          if (i === 0) {
            this.graphCtx.moveTo(x, y);
          } else {
            this.graphCtx.lineTo(x, y);
          }
        }
        this.graphCtx.stroke();

        // Draw legend
        this.graphCtx.font = '10px Inter';
        this.graphCtx.fillStyle = '#88ff88';
        this.graphCtx.fillText('Rabbits', 10, 15);
        this.graphCtx.fillStyle = '#ff8844';
        this.graphCtx.fillText('Foxes', 10, 30);
      },

      updateStats() {
        document.getElementById('dayValue').textContent = currentDay;
        document.getElementById('timeValue').textContent = isDaytime ? 'Day' : 'Night';
        document.getElementById('rabbitCountStat').textContent = rabbits.filter(r => !r.dead).length;
        document.getElementById('foxCountStat').textContent = foxes.filter(f => !f.dead).length;
        document.getElementById('foodCountStat').textContent = foodItems.filter(f => !f.eaten).length;
      },

      reset() {
        this.pause();
        initSimulation(this.canvas);
        this.draw();
      },

      pause() {
        this.isPaused = true;
      },

      play() {
        this.isPaused = false;
        this.lastTime = performance.now();
      }
    };

    // UI Controller
    const UIController = {
      sidebar: null,
      overlay: null,
      playButton: null,
      resetButton: null,

      init() {
        this.sidebar = document.getElementById('simulationSidebar');
        this.overlay = document.getElementById('simulationOverlay');
        this.playButton = document.getElementById('playButton');
        this.resetButton = document.getElementById('resetButton');

        this.setupSidebarToggle();
        this.setupControls();
        this.setupOverlay();
        this.setupCanvas();
        this.showOverlay();
      },

      setupSidebarToggle() {
        const toggle = document.getElementById('sidebarToggle');
        const mobileExpandBtn = document.getElementById('mobileExpandBtn');
        const mobileCollapseBtn = document.getElementById('mobileCollapseBtn');

        const updateButtons = () => {
          const isCollapsed = this.sidebar.classList.contains('collapsed');
          if (toggle && !isMobile()) {
            toggle.textContent = isCollapsed ? '☰' : '✕';
          }
        };

        if (toggle) {
          toggle.addEventListener('click', () => {
            this.sidebar.classList.toggle('collapsed');
            updateButtons();
          });
        }

        if (mobileExpandBtn) {
          mobileExpandBtn.addEventListener('click', () => {
            this.sidebar.classList.remove('collapsed');
            updateButtons();
          });
        }

        if (mobileCollapseBtn) {
          mobileCollapseBtn.addEventListener('click', () => {
            this.sidebar.classList.add('collapsed');
            updateButtons();
          });
        }

        updateButtons();
        window.addEventListener('resize', updateButtons);
      },

      setupControls() {
        const controls = [
          { id: 'rabbitCount', param: 'rabbitCount', parser: parseInt },
          { id: 'foxCount', param: 'foxCount', parser: parseInt },
          { id: 'dayLength', param: 'dayLength', parser: parseInt },
          { id: 'foodGrowth', param: 'foodGrowthRate', parser: parseFloat, decimals: 1 },
          { id: 'rabbitSpeed', param: 'rabbitSpeed', parser: parseFloat, decimals: 1 },
          { id: 'foxSpeed', param: 'foxSpeed', parser: parseFloat, decimals: 1 },
          { id: 'foxVision', param: 'foxVisionRange', parser: parseInt },
          { id: 'rabbitRepro', param: 'rabbitReproductionDays', parser: parseInt },
          { id: 'foxRepro', param: 'foxReproductionDays', parser: parseInt }
        ];

        controls.forEach(({ id, param, parser, decimals }) => {
          const input = document.getElementById(id);
          const valueDisplay = document.getElementById(id + 'Value');

          input.addEventListener('input', (e) => {
            params[param] = parser(e.target.value);
            valueDisplay.textContent = decimals !== undefined
              ? params[param].toFixed(decimals)
              : params[param];
          });
        });
      },

      setupOverlay() {
        this.playButton.addEventListener('click', () => {
          Simulation.play();
          this.hideOverlay();
        });

        this.resetButton.addEventListener('click', () => {
          Simulation.reset();
          this.showOverlay();
        });
      },

      setupCanvas() {
        const canvas = document.getElementById('simulationCanvas');

        const pauseSimulation = () => {
          Simulation.pause();
          this.showOverlay();
        };

        canvas.addEventListener('click', pauseSimulation);
        canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          pauseSimulation();
        });
      },

      showOverlay() {
        this.overlay.classList.add('active');
      },

      hideOverlay() {
        this.overlay.classList.remove('active');
      }
    };

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('simulationCanvas');
      const graphCanvas = document.getElementById('populationGraph');
      Simulation.init(canvas, graphCanvas);
      UIController.init();
    });
  </script>

  <script src="../../assets/js/main.js"></script>
