  <script>
    /**
     * Ant Colony Food Foraging Simulation
     * Dual-pheromone system with simple local signaling rules that create complex emergent behavior
     *
     * Realistic Ant Behavior:
     * 1. TWO PHEROMONE TYPES:
     *    - Food Pheromone (Yellow/Orange): Deposited by ants returning WITH food
     *      → Stronger signal, evaporates faster
     *      → Tells other ants "Follow me to find food!"
     *    - Exploration Pheromone (Blue/Cyan): Deposited by ants leaving colony
     *      → Weaker signal, evaporates much slower
     *      → Helps ants find their way back home
     *
     * 2. SEARCHING BEHAVIOR (No Food):
     *    - Ants deposit weak exploration pheromones as they explore
     *    - They FOLLOW food pheromone trails (yellow/orange) to find food
     *    - They AVOID exploration pheromones (blue) to reduce overlap
     *    - This creates efficient area coverage without redundant searching
     *    - Random wandering when no pheromone signals detected
     *
     * 3. RETURNING BEHAVIOR (Carrying Food):
     *    - Ants deposit strong FOOD pheromones on way back
     *    - They follow EXPLORATION pheromones to find colony
     *    - Creates bidirectional communication system
     *
     * 4. SENSORS: Three sensors (left, forward, right) detect pheromones
     *
     * 5. SMART BEHAVIORS FOR EFFICIENCY:
     *    - Box boundaries: Solid walls (ants bounce off edges)
     *    - Exploration avoidance: Ants steer away from explored areas (blue trails)
     *    - Timeout: Ants return home after 30s without finding food
     *    - Distance limit: Ants don't explore beyond 60% of canvas width
     *    - Limited exploration pheromone: Only deposit near colony (within 40%)
     *    - Home bias: When far from colony, slight pull toward home
     *    - Balanced evaporation: Exploration pheromones decay to prevent buildup
     *
     * 6. EMERGENCE: Colony optimizes food collection without central control
     *    - Better area coverage (ants avoid overlapping searches)
     *    - Multiple efficient routes to different food sources
     *    - Self-organizing behavior from simple local rules
     */

    const params = {
      antCount: 100,
      antSpeed: 1.0,
      pheromoneDeposit: 10,
      pheromoneEvaporation: 0.95,
      wanderStrength: 0.05,  // Low default for focused exploration
      sensorAngle: 45 * Math.PI / 180,
      sensorDistance: 20,
      foodSize: 30,
      foodSourceCount: 1
    };

    // Mobile detection and scaling
    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
    }

    function getDeviceScale() {
      if (window.innerWidth <= 480) {
        return 0.6; // Small phones
      } else if (window.innerWidth <= 768) {
        return 0.75; // Tablets and larger phones
      }
      return 1.0; // Desktop
    }

    // Dual Pheromone grid for efficient pheromone tracking
    // Type 1: Food pheromone (deposited when returning WITH food)
    // Type 2: Exploration pheromone (deposited when leaving colony)
    class PheromoneGrid {
      constructor(width, height, cellSize = 10) {
        this.cellSize = cellSize;
        this.cols = Math.ceil(width / cellSize);
        this.rows = Math.ceil(height / cellSize);
        // Two separate grids for two pheromone types
        this.foodGrid = new Array(this.rows * this.cols).fill(0);      // Type 1: Food trail
        this.explorationGrid = new Array(this.rows * this.cols).fill(0); // Type 2: Exploration trail
      }

      resize(width, height) {
        this.cols = Math.ceil(width / this.cellSize);
        this.rows = Math.ceil(height / this.cellSize);
        this.foodGrid = new Array(this.rows * this.cols).fill(0);
        this.explorationGrid = new Array(this.rows * this.cols).fill(0);
      }

      getIndex(x, y) {
        const col = Math.floor(x / this.cellSize);
        const row = Math.floor(y / this.cellSize);
        if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return -1;
        return row * this.cols + col;
      }

      // Deposit food pheromone (stronger, evaporates faster)
      depositFood(x, y, amount) {
        const idx = this.getIndex(x, y);
        if (idx >= 0) {
          this.foodGrid[idx] += amount;
        }
      }

      // Deposit exploration pheromone (weaker, evaporates slower)
      depositExploration(x, y, amount) {
        const idx = this.getIndex(x, y);
        if (idx >= 0) {
          this.explorationGrid[idx] += amount;
        }
      }

      // Sense food pheromone
      senseFood(x, y) {
        const idx = this.getIndex(x, y);
        return idx >= 0 ? this.foodGrid[idx] : 0;
      }

      // Sense exploration pheromone
      senseExploration(x, y) {
        const idx = this.getIndex(x, y);
        return idx >= 0 ? this.explorationGrid[idx] : 0;
      }

      evaporate() {
        // Food pheromone evaporates faster
        for (let i = 0; i < this.foodGrid.length; i++) {
          this.foodGrid[i] *= params.pheromoneEvaporation;
          if (this.foodGrid[i] < 0.01) this.foodGrid[i] = 0;
        }

        // Exploration pheromone evaporates slower but not too slow (prevents buildup)
        const explorationEvaporation = 0.992; // Slower than food but still evaporates
        for (let i = 0; i < this.explorationGrid.length; i++) {
          this.explorationGrid[i] *= explorationEvaporation;
          if (this.explorationGrid[i] < 0.01) this.explorationGrid[i] = 0;
        }
      }
    }

    // Ant class
    class Ant {
      constructor(x, y, colonyX, colonyY) {
        this.pos = { x, y };
        this.colonyPos = { x: colonyX, y: colonyY };
        this.angle = Math.random() * Math.PI * 2;
        this.hasFood = false;
        this.size = 3 * getDeviceScale();

        // Anti-death-loop mechanisms
        this.timeSinceLastFood = 0;
        this.returnHomeTimer = 0;
        this.maxSearchTime = 30; // After 30 seconds without food, return home
      }

      update(pheromones, foodSources, canvas, dt) {
        const speed = params.antSpeed * 2;

        if (this.hasFood) {
          // Reset search timer when carrying food
          this.timeSinceLastFood = 0;

          // Returning to colony WITH food
          const dx = this.colonyPos.x - this.pos.x;
          const dy = this.colonyPos.y - this.pos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 10) {
            // Reached colony - deposit food
            this.hasFood = false;
            // Increment collected count in global state
            if (foodSources.length > 0) {
              foodSources[0].collected++;
            }
            // Turn around to go back
            this.angle += Math.PI;
          } else {
            // Move towards colony and deposit FOOD pheromone (Type 1)
            // This tells other ants "there's food this way!"
            pheromones.depositFood(this.pos.x, this.pos.y, params.pheromoneDeposit);

            // Follow exploration pheromones back to colony (move toward higher concentration)
            const sensorDist = params.sensorDistance;
            const sensorAngle = params.sensorAngle;

            const leftX = this.pos.x + Math.cos(this.angle - sensorAngle) * sensorDist;
            const leftY = this.pos.y + Math.sin(this.angle - sensorAngle) * sensorDist;
            const forwardX = this.pos.x + Math.cos(this.angle) * sensorDist;
            const forwardY = this.pos.y + Math.sin(this.angle) * sensorDist;
            const rightX = this.pos.x + Math.cos(this.angle + sensorAngle) * sensorDist;
            const rightY = this.pos.y + Math.sin(this.angle + sensorAngle) * sensorDist;

            const leftSignal = pheromones.senseExploration(leftX, leftY);
            const forwardSignal = pheromones.senseExploration(forwardX, forwardY);
            const rightSignal = pheromones.senseExploration(rightX, rightY);

            const totalSignal = leftSignal + forwardSignal + rightSignal;

            if (totalSignal > 0.1) {
              // Follow exploration trail back - turn towards strongest signal
              if (forwardSignal > leftSignal && forwardSignal > rightSignal) {
                // Continue forward
              } else if (rightSignal > leftSignal && rightSignal > forwardSignal) {
                this.angle += 0.15;
              } else if (leftSignal > rightSignal && leftSignal > forwardSignal) {
                this.angle -= 0.15;
              }
            } else {
              // No trail - head directly to colony
              this.angle = Math.atan2(dy, dx);
            }
          }
        } else {
          // Increment search timer
          this.timeSinceLastFood += dt;

          // Calculate distance from colony
          const dx = this.colonyPos.x - this.pos.x;
          const dy = this.colonyPos.y - this.pos.y;
          const distFromColony = Math.sqrt(dx * dx + dy * dy);
          // Check if ant has been searching too long - return home behavior
          const shouldReturnHome = this.timeSinceLastFood > this.maxSearchTime || distFromColony > canvas.width * 0.6;

          // Searching for food - check all food sources first
          let foundFood = false;
          for (const food of foodSources) {
            const fdx = food.x - this.pos.x;
            const fdy = food.y - this.pos.y;
            const dist = Math.sqrt(fdx * fdx + fdy * fdy);

            if (dist < food.radius && food.amount > 0) {
              // Found food!
              this.hasFood = true;
              food.amount--;
              this.timeSinceLastFood = 0; // Reset timer
              // Turn around to return to colony
              this.angle += Math.PI;
              foundFood = true;
              break;
            }
          }

          if (!foundFood) {
            if (shouldReturnHome) {
              // Been searching too long or too far - return to colony
              // Don't deposit exploration pheromones (avoid creating false trails)
              // Head directly back to colony
              this.angle = Math.atan2(dy, dx);

              // Add small random variation to avoid getting stuck
              this.angle += (Math.random() - 0.5) * 0.3;

              // If close to colony, reset the timer
              if (distFromColony < 50) {
                this.timeSinceLastFood = 0;
              }
            } else {
              // Normal search behavior
              // Deposit weak EXPLORATION pheromone (Type 2) only when not too far from colony
              // This prevents creating misleading trails far from home
              if (distFromColony < canvas.width * 0.4) {
                pheromones.depositExploration(this.pos.x, this.pos.y, params.pheromoneDeposit * 0.3);
              }

              // Use sensors to detect both FOOD and EXPLORATION pheromones
              const sensorDist = params.sensorDistance;
              const sensorAngle = params.sensorAngle;

              // Three sensors: left, forward, right
              const leftX = this.pos.x + Math.cos(this.angle - sensorAngle) * sensorDist;
              const leftY = this.pos.y + Math.sin(this.angle - sensorAngle) * sensorDist;
              const forwardX = this.pos.x + Math.cos(this.angle) * sensorDist;
              const forwardY = this.pos.y + Math.sin(this.angle) * sensorDist;
              const rightX = this.pos.x + Math.cos(this.angle + sensorAngle) * sensorDist;
              const rightY = this.pos.y + Math.sin(this.angle + sensorAngle) * sensorDist;

              // Sense FOOD pheromones (looking for food trails - ATTRACT to these)
              const leftFoodSignal = pheromones.senseFood(leftX, leftY);
              const forwardFoodSignal = pheromones.senseFood(forwardX, forwardY);
              const rightFoodSignal = pheromones.senseFood(rightX, rightY);

              // Sense EXPLORATION pheromones (areas already explored - AVOID these)
              const leftExploreSignal = pheromones.senseExploration(leftX, leftY);
              const forwardExploreSignal = pheromones.senseExploration(forwardX, forwardY);
              const rightExploreSignal = pheromones.senseExploration(rightX, rightY);

              // Calculate combined signals (attracted to food, repelled by exploration)
              const leftSignal = leftFoodSignal - (leftExploreSignal * 0.5);
              const forwardSignal = forwardFoodSignal - (forwardExploreSignal * 0.5);
              const rightSignal = rightFoodSignal - (rightExploreSignal * 0.5);

              // Realistic ant behavior: follow food trails, avoid already-explored areas
              const totalFoodSignal = leftFoodSignal + forwardFoodSignal + rightFoodSignal;

              if (totalFoodSignal > 0.1) {
                // Strong food trail detected - follow it (prioritize food over exploration avoidance)
                if (forwardFoodSignal > leftFoodSignal && forwardFoodSignal > rightFoodSignal) {
                  // Continue forward - no turn needed
                } else if (rightFoodSignal > leftFoodSignal && rightFoodSignal > forwardFoodSignal) {
                  // Turn right towards stronger signal
                  this.angle += 0.15;
                } else if (leftFoodSignal > rightFoodSignal && leftFoodSignal > forwardFoodSignal) {
                  // Turn left towards stronger signal
                  this.angle -= 0.15;
                }

                // Small random variation even when following trail
                this.angle += (Math.random() - 0.5) * params.wanderStrength * 0.3;
              } else {
                // No food trail - use combined signal (avoid explored areas)
                // But make turning more subtle to avoid radial patterns
                if (leftSignal > forwardSignal && leftSignal > rightSignal && leftSignal > 0) {
                  // Turn left - less explored or has food
                  this.angle -= 0.05;
                } else if (rightSignal > leftSignal && rightSignal > forwardSignal && rightSignal > 0) {
                  // Turn right - less explored or has food
                  this.angle += 0.05;
                }

                // Strong random wandering to break radial patterns
                // Add occasional sharp turns for more scattered exploration
                if (Math.random() < 0.1) {
                  // 10% chance of sharp turn (breaks circular patterns)
                  this.angle += (Math.random() - 0.5) * Math.PI * 0.5;
                } else {
                  // Normal random wander with high variation
                  this.angle += (Math.random() - 0.5) * params.wanderStrength * 3;
                }

                // Very slight bias towards colony only when VERY far away
                if (distFromColony > canvas.width * 0.5) {
                  const homeAngle = Math.atan2(dy, dx);
                  const angleDiff = homeAngle - this.angle;
                  // Normalize angle difference to -PI to PI
                  const normalizedDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
                  // Very weak nudge towards home (only 5% influence)
                  this.angle += normalizedDiff * 0.05;
                }
              }
            }
          }
        }

        // Move in current direction
        this.pos.x += Math.cos(this.angle) * speed;
        this.pos.y += Math.sin(this.angle) * speed;

        // Solid box boundaries - bounce off walls
        const margin = this.size * 2;
        if (this.pos.x < margin) {
          this.pos.x = margin;
          this.angle = Math.PI - this.angle; // Bounce off left wall
        } else if (this.pos.x > canvas.width - margin) {
          this.pos.x = canvas.width - margin;
          this.angle = Math.PI - this.angle; // Bounce off right wall
        }

        if (this.pos.y < margin) {
          this.pos.y = margin;
          this.angle = -this.angle; // Bounce off top wall
        } else if (this.pos.y > canvas.height - margin) {
          this.pos.y = canvas.height - margin;
          this.angle = -this.angle; // Bounce off bottom wall
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.pos.x, this.pos.y);
        ctx.rotate(this.angle);

        // Ant color based on state
        const bodyColor = this.hasFood ? '#00ff88' : '#ff6b35';

        // Draw ant body parts: abdomen, thorax, head
        // Abdomen (back)
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.ellipse(-this.size * 1.2, 0, this.size * 0.9, this.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Thorax (middle)
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 0.7, this.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Head (front)
        ctx.beginPath();
        ctx.ellipse(this.size * 0.9, 0, this.size * 0.6, this.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Draw legs (6 legs - 3 on each side)
        ctx.strokeStyle = bodyColor;
        ctx.lineWidth = this.size * 0.15;
        ctx.lineCap = 'round';

        const legLength = this.size * 1.2;
        const legPositions = [-0.8, -0.2, 0.4]; // Positions along body

        for (const legPos of legPositions) {
          // Left leg
          ctx.beginPath();
          ctx.moveTo(legPos * this.size, 0);
          ctx.lineTo(legPos * this.size - legLength * 0.4, -legLength);
          ctx.stroke();

          // Right leg
          ctx.beginPath();
          ctx.moveTo(legPos * this.size, 0);
          ctx.lineTo(legPos * this.size - legLength * 0.4, legLength);
          ctx.stroke();
        }

        // Draw antennae
        ctx.lineWidth = this.size * 0.1;
        ctx.beginPath();
        ctx.moveTo(this.size * 0.9, 0);
        ctx.lineTo(this.size * 1.5, -this.size * 0.8);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(this.size * 0.9, 0);
        ctx.lineTo(this.size * 1.5, this.size * 0.8);
        ctx.stroke();

        // If carrying food, draw food particle on back
        if (this.hasFood) {
          ctx.fillStyle = '#ffdd44';
          ctx.beginPath();
          ctx.arc(-this.size * 1.2, 0, this.size * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    // Food source
    class FoodSource {
      constructor(x, y, radius, amount) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.initialAmount = amount;
        this.amount = amount;
        this.collected = 0;

        // Generate fixed positions for food particles in a uniform grid
        this.foodParticles = [];
        this.generateFoodParticles();
      }

      generateFoodParticles() {
        this.foodParticles = [];
        const particlesPerRow = Math.ceil(Math.sqrt(this.initialAmount));
        const spacing = (this.radius * 1.6) / particlesPerRow;

        for (let i = 0; i < this.initialAmount; i++) {
          const row = Math.floor(i / particlesPerRow);
          const col = i % particlesPerRow;

          // Calculate position with slight random offset for natural look
          const offsetX = (col - particlesPerRow / 2) * spacing + (Math.random() - 0.5) * spacing * 0.3;
          const offsetY = (row - particlesPerRow / 2) * spacing + (Math.random() - 0.5) * spacing * 0.3;

          // Only add if within circular radius
          if (Math.sqrt(offsetX * offsetX + offsetY * offsetY) < this.radius) {
            this.foodParticles.push({
              x: this.x + offsetX,
              y: this.y + offsetY,
              visible: true
            });
          }
        }
      }

      draw(ctx) {
        // Draw food pile with varying intensity based on remaining food
        const intensity = this.amount / this.initialAmount;

        // Outer glow
        if (this.amount > 0) {
          const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
          gradient.addColorStop(0, `rgba(0, 255, 136, ${0.4 * intensity})`);
          gradient.addColorStop(0.5, `rgba(0, 255, 136, ${0.2 * intensity})`);
          gradient.addColorStop(1, 'rgba(0, 255, 136, 0)');

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw static food particles - only show as many as remain
        let particlesDrawn = 0;
        for (let i = 0; i < this.foodParticles.length && particlesDrawn < this.amount; i++) {
          const particle = this.foodParticles[i];

          // Draw food crumb
          ctx.fillStyle = '#ffdd44';
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 2, 0, Math.PI * 2);
          ctx.fill();

          // Add slight highlight
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.beginPath();
          ctx.arc(particle.x - 0.5, particle.y - 0.5, 1, 0, Math.PI * 2);
          ctx.fill();

          particlesDrawn++;
        }
      }
    }

    // Colony
    class Colony {
      constructor(x, y, radius = 20) {
        this.x = x;
        this.y = y;
        this.radius = radius * getDeviceScale();
      }

      draw(ctx) {
        // Draw colony as a pulsing circle
        const pulse = Math.sin(Date.now() / 500) * 0.2 + 0.8;

        // Outer glow
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 1.5);
        gradient.addColorStop(0, `rgba(74, 158, 255, ${0.6 * pulse})`);
        gradient.addColorStop(0.7, `rgba(74, 158, 255, ${0.3 * pulse})`);
        gradient.addColorStop(1, 'rgba(74, 158, 255, 0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Inner colony
        ctx.fillStyle = '#4a9eff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Colony pattern
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    let ants = [];
    let pheromones = null;
    let foodSources = [];
    let colony = null;
    let totalFoodCollected = 0;

    function initSimulation(canvas) {
      ants = [];
      foodSources = [];
      totalFoodCollected = 0;

      // Create colony at bottom center
      const colonyX = canvas.width / 2;
      const colonyY = canvas.height - 50;
      colony = new Colony(colonyX, colonyY);

      // Create multiple food sources at random locations
      const foodCount = params.foodSourceCount;
      for (let i = 0; i < foodCount; i++) {
        let foodX, foodY;
        let validPosition = false;
        let attempts = 0;

        // Try to find a position that doesn't overlap with other food sources or colony
        while (!validPosition && attempts < 50) {
          foodX = canvas.width * (0.2 + Math.random() * 0.6);
          foodY = canvas.height * (0.1 + Math.random() * 0.4);

          // Check distance from colony
          const distToColony = Math.sqrt(
            Math.pow(foodX - colonyX, 2) + Math.pow(foodY - colonyY, 2)
          );

          // Check distance from other food sources
          let tooClose = false;
          for (const existingFood of foodSources) {
            const dist = Math.sqrt(
              Math.pow(foodX - existingFood.x, 2) + Math.pow(foodY - existingFood.y, 2)
            );
            if (dist < params.foodSize * 3) {
              tooClose = true;
              break;
            }
          }

          if (distToColony > 100 && !tooClose) {
            validPosition = true;
          }
          attempts++;
        }

        foodSources.push(new FoodSource(foodX, foodY, params.foodSize, 100));
      }

      // Create pheromone grid
      pheromones = new PheromoneGrid(canvas.width, canvas.height);

      // Spawn ants at colony with varied starting angles
      for (let i = 0; i < params.antCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * colony.radius;
        const x = colonyX + Math.cos(angle) * dist;
        const y = colonyY + Math.sin(angle) * dist;
        const ant = new Ant(x, y, colonyX, colonyY);

        // Give each ant a random starting direction (not necessarily away from colony)
        // This helps create more scattered initial exploration
        ant.angle = Math.random() * Math.PI * 2;

        ants.push(ant);
      }
    }

    const Simulation = {
      canvas: null,
      ctx: null,
      isPaused: true,
      lastTime: 0,
      fps: 60,
      frameCount: 0,
      fpsTime: 0,

      init(canvasElement) {
        this.canvas = canvasElement;
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        initSimulation(this.canvas);
        this.lastTime = performance.now();
        this.animate();
      },

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;

        if (pheromones) {
          pheromones.resize(this.canvas.width, this.canvas.height);
        }
      },

      animate() {
        requestAnimationFrame(() => this.animate());
        const currentTime = performance.now();
        const deltaTime = (currentTime - this.lastTime) / 1000;
        this.lastTime = currentTime;

        this.frameCount++;
        this.fpsTime += deltaTime;
        if (this.fpsTime >= 1) {
          this.fps = Math.round(this.frameCount / this.fpsTime);
          this.frameCount = 0;
          this.fpsTime = 0;
        }

        if (!this.isPaused) {
          this.update(deltaTime);
        }
        this.draw();
        this.updateStats();
      },

      update(dt) {
        // Update all ants with delta time for timeout tracking
        for (const ant of ants) {
          ant.update(pheromones, foodSources, this.canvas, dt);
        }

        // Evaporate pheromones
        pheromones.evaporate();
      },

      draw() {
        // Clear canvas with dark background
        this.ctx.fillStyle = 'rgba(10, 10, 10, 1)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw box boundary
        this.ctx.strokeStyle = 'rgba(74, 158, 255, 0.3)';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(5, 5, this.canvas.width - 10, this.canvas.height - 10);

        // Draw pheromone trails
        this.drawPheromones();

        // Draw all food sources
        for (const food of foodSources) {
          food.draw(this.ctx);
        }

        // Draw colony
        if (colony) {
          colony.draw(this.ctx);
        }

        // Draw all ants
        for (const ant of ants) {
          ant.draw(this.ctx);
        }
      },

      drawPheromones() {
        // Draw dual pheromone grid with different colors for each type
        const cellSize = pheromones.cellSize;

        for (let row = 0; row < pheromones.rows; row++) {
          for (let col = 0; col < pheromones.cols; col++) {
            const idx = row * pheromones.cols + col;
            const x = col * cellSize;
            const y = row * cellSize;

            // Get both pheromone strengths
            const foodStrength = Math.min(pheromones.foodGrid[idx] / 50, 1);
            const explorationStrength = Math.min(pheromones.explorationGrid[idx] / 50, 1);

            // Draw exploration pheromone (blue/cyan) - weaker, more persistent
            if (explorationStrength > 0.05) {
              const r = 100;
              const g = 150 + explorationStrength * 100;
              const b = 255;
              this.ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${explorationStrength * 0.4})`;
              this.ctx.fillRect(x, y, cellSize, cellSize);
            }

            // Draw food pheromone (yellow/orange/red) - stronger signal
            if (foodStrength > 0.05) {
              let r, g, b;
              if (foodStrength < 0.5) {
                // Yellow to orange
                r = 255;
                g = 255 - (foodStrength * 100);
                b = 50;
              } else {
                // Orange to red
                r = 255;
                g = 200 - (foodStrength * 200);
                b = 30;
              }

              // Food pheromone overlays on top of exploration
              this.ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${foodStrength * 0.6})`;
              this.ctx.fillRect(x, y, cellSize, cellSize);
            }
          }
        }
      },

      updateStats() {
        document.getElementById('fpsValue').textContent = this.fps;
        document.getElementById('antCountStat').textContent = ants.length;

        // Calculate total food collected and remaining
        let totalCollected = 0;
        let totalRemaining = 0;
        let activeSources = 0;

        for (const food of foodSources) {
          totalCollected += food.collected;
          totalRemaining += food.amount;
          if (food.amount > 0) {
            activeSources++;
          }
        }

        document.getElementById('foodSourcesActive').textContent = activeSources + '/' + foodSources.length;
        document.getElementById('foodCollected').textContent = totalCollected;
        document.getElementById('foodRemaining').textContent = totalRemaining;
      },

      reset() {
        this.pause();
        initSimulation(this.canvas);
        this.draw();
      },

      pause() {
        this.isPaused = true;
      },

      play() {
        this.isPaused = false;
        this.lastTime = performance.now();
      }
    };

    // UI Controller
    const UIController = {
      sidebar: null,
      overlay: null,
      playButton: null,
      resetButton: null,

      init() {
        this.sidebar = document.getElementById('simulationSidebar');
        this.overlay = document.getElementById('simulationOverlay');
        this.playButton = document.getElementById('playButton');
        this.resetButton = document.getElementById('resetButton');

        this.setupSidebarToggle();
        this.setupControls();
        this.setupOverlay();
        this.setupCanvas();
        this.showOverlay();
      },

      setupSidebarToggle() {
        const toggle = document.getElementById('sidebarToggle');
        const controlBtn = document.getElementById('sidebarControlBtn');
        const mobileExpandBtn = document.getElementById('mobileExpandBtn');
        const mobileCollapseBtn = document.getElementById('mobileCollapseBtn');

        const updateButtons = () => {
          const isCollapsed = this.sidebar.classList.contains('collapsed');
          if (toggle && !isMobile()) {
            toggle.textContent = isCollapsed ? '☰' : '✕';
          }
          if (controlBtn) {
            controlBtn.textContent = isCollapsed ? '→' : '←';
          }
        };

        if (toggle) {
          toggle.addEventListener('click', () => {
            this.sidebar.classList.toggle('collapsed');
            updateButtons();
          });
        }

        if (controlBtn) {
          controlBtn.addEventListener('click', () => {
            this.sidebar.classList.toggle('collapsed');
            updateButtons();
          });
        }

        if (mobileExpandBtn) {
          mobileExpandBtn.addEventListener('click', () => {
            this.sidebar.classList.remove('collapsed');
            updateButtons();
          });
        }

        if (mobileCollapseBtn) {
          mobileCollapseBtn.addEventListener('click', () => {
            this.sidebar.classList.add('collapsed');
            updateButtons();
          });
        }

        updateButtons();
        window.addEventListener('resize', updateButtons);
      },

      setupControls() {
        // Ant Count
        const antCountInput = document.getElementById('antCount');
        const antCountValue = document.getElementById('antCountValue');
        antCountInput.addEventListener('input', (e) => {
          params.antCount = parseInt(e.target.value);
          antCountValue.textContent = params.antCount;
        });

        // Ant Speed
        const antSpeedInput = document.getElementById('antSpeed');
        const antSpeedValue = document.getElementById('antSpeedValue');
        antSpeedInput.addEventListener('input', (e) => {
          params.antSpeed = parseFloat(e.target.value);
          antSpeedValue.textContent = params.antSpeed.toFixed(1);
        });

        // Pheromone Deposit
        const pheromoneDepositInput = document.getElementById('pheromoneDeposit');
        const pheromoneDepositValue = document.getElementById('pheromoneDepositValue');
        pheromoneDepositInput.addEventListener('input', (e) => {
          params.pheromoneDeposit = parseInt(e.target.value);
          pheromoneDepositValue.textContent = params.pheromoneDeposit;
        });

        // Pheromone Evaporation
        const pheromoneEvaporationInput = document.getElementById('pheromoneEvaporation');
        const pheromoneEvaporationValue = document.getElementById('pheromoneEvaporationValue');
        pheromoneEvaporationInput.addEventListener('input', (e) => {
          params.pheromoneEvaporation = parseFloat(e.target.value);
          pheromoneEvaporationValue.textContent = params.pheromoneEvaporation.toFixed(2);
        });

        // Wander Strength
        const wanderStrengthInput = document.getElementById('wanderStrength');
        const wanderStrengthValue = document.getElementById('wanderStrengthValue');
        wanderStrengthInput.addEventListener('input', (e) => {
          params.wanderStrength = parseFloat(e.target.value);
          wanderStrengthValue.textContent = params.wanderStrength.toFixed(2);
        });

        // Sensor Angle
        const sensorAngleInput = document.getElementById('sensorAngle');
        const sensorAngleValue = document.getElementById('sensorAngleValue');
        sensorAngleInput.addEventListener('input', (e) => {
          const degrees = parseInt(e.target.value);
          params.sensorAngle = degrees * Math.PI / 180;
          sensorAngleValue.textContent = degrees;
        });

        // Sensor Distance
        const sensorDistanceInput = document.getElementById('sensorDistance');
        const sensorDistanceValue = document.getElementById('sensorDistanceValue');
        sensorDistanceInput.addEventListener('input', (e) => {
          params.sensorDistance = parseInt(e.target.value);
          sensorDistanceValue.textContent = params.sensorDistance;
        });

        // Food Size
        const foodSizeInput = document.getElementById('foodSize');
        const foodSizeValue = document.getElementById('foodSizeValue');
        foodSizeInput.addEventListener('input', (e) => {
          params.foodSize = parseInt(e.target.value);
          foodSizeValue.textContent = params.foodSize;
        });

        // Food Source Count
        const foodSourceCountInput = document.getElementById('foodSourceCount');
        const foodSourceCountValue = document.getElementById('foodSourceCountValue');
        foodSourceCountInput.addEventListener('input', (e) => {
          params.foodSourceCount = parseInt(e.target.value);
          foodSourceCountValue.textContent = params.foodSourceCount;
        });
      },

      setupOverlay() {
        this.playButton.addEventListener('click', () => {
          Simulation.play();
          this.hideOverlay();
        });

        this.resetButton.addEventListener('click', () => {
          Simulation.reset();
          this.showOverlay();
        });
      },

      setupCanvas() {
        const canvas = document.getElementById('simulationCanvas');

        const pauseSimulation = () => {
          Simulation.pause();
          this.showOverlay();
        };

        canvas.addEventListener('click', pauseSimulation);
        canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          pauseSimulation();
        });
      },

      showOverlay() {
        this.overlay.classList.add('active');
      },

      hideOverlay() {
        this.overlay.classList.remove('active');
      }
    };

    // Initialize everything on page load
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('simulationCanvas');
      Simulation.init(canvas);
      UIController.init();
    });
  </script>

  <script src="../../assets/js/main.js"></script>
</body>
</html>
