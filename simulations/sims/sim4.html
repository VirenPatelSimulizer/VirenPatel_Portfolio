  <script>
    /**
     * Particle-Based Turing Reaction-Diffusion
     *
     * Uses Brownian motion in continuous 2D space with stochastic local reactions.
     * Implements activator-inhibitor dynamics:
     * - Activator (A): autocatalytic, promotes itself
     * - Inhibitor (B): generated by A, suppresses A, diffuses faster (DB >> DA)
     *
     * Reaction rules (stochastic, within radius r):
     * 1. Autocatalysis: A + A → 2A + A' (rate k1) - activator promotes birth of new activator
     * 2. Inhibitor generation: A → A + B (rate k2) - activator creates inhibitor
     * 3. Suppression: A + B → B (rate k3) - inhibitor kills activator
     * 4. Decay: A → ∅ (rate decayA), B → ∅ (rate decayB)
     *
     * Turing instability requires: DB >> DA (inhibitor diffuses faster than activator)
     */

    const CONFIG = {
      // Canvas and simulation size
      WIDTH: 600,
      HEIGHT: 600,

      // Diffusion coefficients - controls random force intensity on velocity
      DA: 0.15,   // Activator diffusion (slow - stays local)
      DB: 0.6,    // Inhibitor diffusion (faster - spreads out to suppress distant A)

      // Velocity damping (0-1, higher = more friction, smoother movement)
      damping: 0.92,

      // Reaction radius
      r: 60,

      // Reaction rates - tuned for pattern formation
      k1: 0.15,   // Autocatalysis rate (A+A -> more A)
      k2: 0.20,   // Inhibitor generation rate (A -> A+B)
      k3: 0.08,   // Suppression rate (A+B -> B, A dies)

      // Decay rates
      decayA: 0.002,  // Very slow decay so patterns persist
      decayB: 0.015,  // Faster B decay so suppression is local in time

      // Cell division velocity - how fast offspring move away from parent
      divisionSpeed: 0.8,

      // Initial particle count (lower for visual style with glowing particles)
      initialParticles: 300,

      // Simulation speed multiplier
      speed: 1.0,

      // Rendering
      renderMode: 'particles',
      colorScheme: 'dualParticle',

      // Spatial hash cell size (should be >= reaction radius)
      cellSize: 65
    };

    // Pattern presets with velocity-based smooth movement
    // Key: DB >> DA (inhibitor diffuses faster), strong autocatalysis, moderate suppression
    const PRESETS = {
      spots: { DA: 0.12, DB: 0.5, r: 50, k1: 0.18, k2: 0.25, k3: 0.06, decayA: 0.001, decayB: 0.02 },
      stripes: { DA: 0.18, DB: 0.7, r: 70, k1: 0.12, k2: 0.18, k3: 0.10, decayA: 0.003, decayB: 0.012 },
      labyrinth: { DA: 0.15, DB: 0.6, r: 60, k1: 0.15, k2: 0.20, k3: 0.08, decayA: 0.002, decayB: 0.015 },
      chaos: { DA: 0.25, DB: 0.5, r: 45, k1: 0.20, k2: 0.15, k3: 0.05, decayA: 0.005, decayB: 0.01 },
      mitosis: { DA: 0.10, DB: 0.6, r: 40, k1: 0.22, k2: 0.30, k3: 0.04, decayA: 0.001, decayB: 0.025 },
      coral: { DA: 0.14, DB: 0.55, r: 55, k1: 0.16, k2: 0.22, k3: 0.07, decayA: 0.002, decayB: 0.018 }
    };

    // Color schemes for density rendering
    const COLORS = {
      dualParticle: (a, b) => {
        // Cyan for activators (A), orange for inhibitors (B) - matching sim3 theme
        const intensityA = Math.min(1, a * 3);
        const intensityB = Math.min(1, b * 2);
        // Blend: cyan activators with orange inhibitor influence
        const r = Math.floor(intensityA * 0 + intensityB * 255 * 0.3);
        const g = Math.floor(intensityA * 212);
        const bl = Math.floor(intensityA * 255 * 0.8);
        return [r, g, bl];
      },
      neonCyan: (a, b) => {
        const intensity = Math.min(1, a * 3);
        return [Math.floor(intensity * 20), Math.floor(intensity * 212), Math.floor(intensity * 255)];
      },
      fire: (a, b) => {
        const v = Math.min(1, a * 3);
        return [Math.min(255, Math.floor(v * 400)), Math.floor(v * 150), Math.floor(v * 40)];
      },
      ocean: (a, b) => {
        const v = Math.min(1, a * 3);
        return [Math.floor(v * 40), Math.floor(80 + v * 120), Math.floor(120 + v * 135)];
      },
      purple: (a, b) => {
        const v = Math.min(1, a * 3);
        return [Math.floor(80 + v * 175), Math.floor(v * 60), Math.floor(120 + v * 135)];
      },
      classic: (a, b) => {
        const v = Math.min(255, Math.floor(a * 3 * 255));
        return [v, v, v];
      }
    };

    /**
     * Spatial Hash Grid for O(1) neighbor lookup
     */
    class SpatialHash {
      constructor(width, height, cellSize) {
        this.cellSize = cellSize;
        this.cols = Math.ceil(width / cellSize);
        this.rows = Math.ceil(height / cellSize);
        this.grid = new Array(this.cols * this.rows);
        this.clear();
      }

      clear() {
        for (let i = 0; i < this.grid.length; i++) {
          this.grid[i] = [];
        }
      }

      getKey(x, y) {
        const col = Math.floor(x / this.cellSize);
        const row = Math.floor(y / this.cellSize);
        // Wrap for periodic boundaries
        const wCol = ((col % this.cols) + this.cols) % this.cols;
        const wRow = ((row % this.rows) + this.rows) % this.rows;
        return wRow * this.cols + wCol;
      }

      insert(particle) {
        const key = this.getKey(particle.x, particle.y);
        this.grid[key].push(particle);
      }

      getNeighbors(x, y, radius) {
        const neighbors = [];
        const cellRadius = Math.ceil(radius / this.cellSize);
        const cx = Math.floor(x / this.cellSize);
        const cy = Math.floor(y / this.cellSize);

        for (let dy = -cellRadius; dy <= cellRadius; dy++) {
          for (let dx = -cellRadius; dx <= cellRadius; dx++) {
            const col = ((cx + dx) % this.cols + this.cols) % this.cols;
            const row = ((cy + dy) % this.rows + this.rows) % this.rows;
            const cell = this.grid[row * this.cols + col];
            for (const p of cell) {
              neighbors.push(p);
            }
          }
        }
        return neighbors;
      }
    }

    /**
     * Main Simulation
     */
    class TuringParticles {
      constructor(width, height) {
        this.width = width;
        this.height = height;
        this.particlesA = [];
        this.particlesB = [];
        this.spatialA = new SpatialHash(width, height, CONFIG.cellSize);
        this.spatialB = new SpatialHash(width, height, CONFIG.cellSize);

        // Density grid for rendering
        this.gridSize = 150;
        this.densityA = new Float32Array(this.gridSize * this.gridSize);
        this.densityB = new Float32Array(this.gridSize * this.gridSize);

        this.init();
      }

      init() {
        this.particlesA = [];
        this.particlesB = [];

        const total = CONFIG.initialParticles;
        const ratioA = 0.5; // Start with 50% activators

        // Seed activators in tight clusters to kickstart pattern formation
        const numClusters = 5;
        const clusterRadius = 40;
        const clusterCenters = [];

        // Place clusters with some spacing
        for (let i = 0; i < numClusters; i++) {
          clusterCenters.push({
            x: 100 + Math.random() * (this.width - 200),
            y: 100 + Math.random() * (this.height - 200)
          });
        }

        // Create activator particles - mostly clustered, with zero initial velocity
        const numA = Math.floor(total * ratioA);
        for (let i = 0; i < numA; i++) {
          let x, y;
          // 85% in tight clusters, 15% scattered
          if (Math.random() < 0.85) {
            const cluster = clusterCenters[Math.floor(Math.random() * numClusters)];
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * clusterRadius;
            x = cluster.x + Math.cos(angle) * dist;
            y = cluster.y + Math.sin(angle) * dist;
          } else {
            x = Math.random() * this.width;
            y = Math.random() * this.height;
          }
          // Periodic boundary wrap
          x = ((x % this.width) + this.width) % this.width;
          y = ((y % this.height) + this.height) % this.height;
          this.particlesA.push({ x, y, vx: 0, vy: 0 });
        }

        // Create inhibitor particles - spread more evenly, with zero initial velocity
        const numB = total - numA;
        for (let i = 0; i < numB; i++) {
          this.particlesB.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            vx: 0,
            vy: 0
          });
        }

        this.rebuildSpatialHash();
      }

      rebuildSpatialHash() {
        this.spatialA.clear();
        this.spatialB.clear();
        for (const p of this.particlesA) this.spatialA.insert(p);
        for (const p of this.particlesB) this.spatialB.insert(p);
      }

      // Box-Muller for Gaussian random
      gaussianRandom() {
        let u = 0, v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
      }

      step(dt = 1) {
        const { DA, DB, r, k1, k2, k3, decayA, decayB, damping, divisionSpeed } = CONFIG;
        const r2 = r * r;

        // Arrays to hold new particles and indices to remove
        const newA = [];
        const newB = [];
        const removeA = new Set();
        const removeB = new Set();

        // 1. Velocity-based Brownian motion for smooth movement
        // Brownian force is added to velocity, then damped, then position is updated
        for (const p of this.particlesA) {
          // Add random Brownian force to velocity
          p.vx += Math.sqrt(2 * DA * dt) * this.gaussianRandom();
          p.vy += Math.sqrt(2 * DA * dt) * this.gaussianRandom();
          // Apply damping for smooth deceleration
          p.vx *= damping;
          p.vy *= damping;
          // Update position based on velocity
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          // Periodic boundaries
          p.x = ((p.x % this.width) + this.width) % this.width;
          p.y = ((p.y % this.height) + this.height) % this.height;
        }

        for (const p of this.particlesB) {
          // Add random Brownian force to velocity
          p.vx += Math.sqrt(2 * DB * dt) * this.gaussianRandom();
          p.vy += Math.sqrt(2 * DB * dt) * this.gaussianRandom();
          // Apply damping for smooth deceleration
          p.vx *= damping;
          p.vy *= damping;
          // Update position based on velocity
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          // Periodic boundaries
          p.x = ((p.x % this.width) + this.width) % this.width;
          p.y = ((p.y % this.height) + this.height) % this.height;
        }

        // Rebuild spatial hash after movement
        this.rebuildSpatialHash();

        // 2. Stochastic reactions
        // Process each activator particle
        for (let i = 0; i < this.particlesA.length; i++) {
          if (removeA.has(i)) continue;
          const pA = this.particlesA[i];

          // Count neighbors
          const neighborsA = this.spatialA.getNeighbors(pA.x, pA.y, r);
          const neighborsB = this.spatialB.getNeighbors(pA.x, pA.y, r);

          let countA = 0, countB = 0;

          for (const n of neighborsA) {
            const dx = this.wrapDist(n.x - pA.x, this.width);
            const dy = this.wrapDist(n.y - pA.y, this.height);
            if (dx * dx + dy * dy < r2 && n !== pA) countA++;
          }

          for (const n of neighborsB) {
            const dx = this.wrapDist(n.x - pA.x, this.width);
            const dy = this.wrapDist(n.y - pA.y, this.height);
            if (dx * dx + dy * dy < r2) countB++;
          }

          // Autocatalysis: A + A → A + A + A' (CELL DIVISION - new particle spawns AT parent and moves away)
          if (countA > 0 && Math.random() < k1 * countA * dt) {
            // Birth new activator at EXACT parent position with outward velocity (cell division effect)
            const angle = Math.random() * Math.PI * 2;
            // New particle starts at parent's exact position
            const nx = pA.x;
            const ny = pA.y;
            // Give it outward velocity (splits from parent)
            const outVx = Math.cos(angle) * divisionSpeed;
            const outVy = Math.sin(angle) * divisionSpeed;
            newA.push({ x: nx, y: ny, vx: outVx, vy: outVy });
            // Also give parent a small opposite push (conservation of momentum feel)
            pA.vx -= outVx * 0.3;
            pA.vy -= outVy * 0.3;
          }

          // Inhibitor generation: A → A + B (CELL DIVISION - B spawns AT parent and moves away)
          if (Math.random() < k2 * dt) {
            const angle = Math.random() * Math.PI * 2;
            // New inhibitor starts at parent's exact position
            const nx = pA.x;
            const ny = pA.y;
            // Give it outward velocity
            const outVx = Math.cos(angle) * divisionSpeed * 0.8;
            const outVy = Math.sin(angle) * divisionSpeed * 0.8;
            newB.push({ x: nx, y: ny, vx: outVx, vy: outVy });
          }

          // Suppression: A + B → B (A dies if B nearby)
          if (countB > 0 && Math.random() < k3 * countB * dt) {
            removeA.add(i);
          }

          // Natural decay
          if (Math.random() < decayA * dt) {
            removeA.add(i);
          }
        }

        // Process inhibitor decay
        for (let i = 0; i < this.particlesB.length; i++) {
          if (Math.random() < decayB * dt) {
            removeB.add(i);
          }
        }

        // Apply removals using filter (more efficient than splice)
        this.particlesA = this.particlesA.filter((_, i) => !removeA.has(i));
        this.particlesB = this.particlesB.filter((_, i) => !removeB.has(i));

        // Add new particles
        for (const p of newA) this.particlesA.push(p);
        for (const p of newB) this.particlesB.push(p);

        // Population control to prevent runaway growth or extinction
        this.populationControl();
      }

      wrapDist(d, size) {
        if (d > size / 2) return d - size;
        if (d < -size / 2) return d + size;
        return d;
      }

      populationControl() {
        const targetTotal = CONFIG.initialParticles;
        const maxParticles = targetTotal * 2;
        const minParticles = targetTotal * 0.1;

        // If too many particles, cull randomly
        if (this.particlesA.length + this.particlesB.length > maxParticles) {
          const excess = (this.particlesA.length + this.particlesB.length) - maxParticles;
          const cullA = Math.floor(excess * (this.particlesA.length / (this.particlesA.length + this.particlesB.length)));
          const cullB = excess - cullA;

          for (let i = 0; i < cullA && this.particlesA.length > 100; i++) {
            const idx = Math.floor(Math.random() * this.particlesA.length);
            this.particlesA.splice(idx, 1);
          }
          for (let i = 0; i < cullB && this.particlesB.length > 100; i++) {
            const idx = Math.floor(Math.random() * this.particlesB.length);
            this.particlesB.splice(idx, 1);
          }
        }

        // If too few activators, inject some with zero velocity
        if (this.particlesA.length < minParticles * 0.5) {
          const inject = Math.floor(minParticles * 0.3);
          for (let i = 0; i < inject; i++) {
            this.particlesA.push({
              x: Math.random() * this.width,
              y: Math.random() * this.height,
              vx: 0,
              vy: 0
            });
          }
        }
      }

      computeDensity() {
        const cellW = this.width / this.gridSize;
        const cellH = this.height / this.gridSize;

        this.densityA.fill(0);
        this.densityB.fill(0);

        for (const p of this.particlesA) {
          const gx = Math.floor(p.x / cellW);
          const gy = Math.floor(p.y / cellH);
          if (gx >= 0 && gx < this.gridSize && gy >= 0 && gy < this.gridSize) {
            this.densityA[gy * this.gridSize + gx]++;
          }
        }

        for (const p of this.particlesB) {
          const gx = Math.floor(p.x / cellW);
          const gy = Math.floor(p.y / cellH);
          if (gx >= 0 && gx < this.gridSize && gy >= 0 && gy < this.gridSize) {
            this.densityB[gy * this.gridSize + gx]++;
          }
        }

        // Normalize
        const maxA = Math.max(...this.densityA) || 1;
        const maxB = Math.max(...this.densityB) || 1;
        for (let i = 0; i < this.densityA.length; i++) {
          this.densityA[i] /= maxA;
          this.densityB[i] /= maxB;
        }
      }

      renderDensity(ctx, imageData) {
        this.computeDensity();
        const data = imageData.data;
        const colorFn = COLORS[CONFIG.colorScheme];

        for (let i = 0; i < this.densityA.length; i++) {
          const [r, g, b] = colorFn(this.densityA[i], this.densityB[i]);
          const pi = i * 4;
          data[pi] = r;
          data[pi + 1] = g;
          data[pi + 2] = b;
          data[pi + 3] = 255;
        }
      }

      renderParticles(ctx) {
        // Clear with gradient background matching sim3
        const gradient = ctx.createLinearGradient(0, 0, this.width, this.height);
        gradient.addColorStop(0, '#0a0a0a');
        gradient.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, this.width, this.height);

        // Particle radius - matching sim3 style
        const radiusA = 5;
        const radiusB = 5;

        // Adaptive shadow blur - reduce for high particle counts for performance
        const totalParticles = this.particlesA.length + this.particlesB.length;
        let shadowBlur;
        if (isMobile() || totalParticles > 800) {
          shadowBlur = 3;
        } else if (totalParticles > 500) {
          shadowBlur = 6;
        } else {
          shadowBlur = 10;
        }

        // Draw activators (cyan - matching sim3 particle A)
        ctx.shadowBlur = shadowBlur;
        ctx.shadowColor = 'rgba(0, 212, 255, 0.6)';
        ctx.fillStyle = 'rgb(0, 212, 255)';
        for (const p of this.particlesA) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, radiusA, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw inhibitors (orange - matching sim3 particle B)
        ctx.shadowColor = 'rgba(255, 107, 53, 0.6)';
        ctx.fillStyle = 'rgb(255, 107, 53)';
        for (const p of this.particlesB) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, radiusB, 0, Math.PI * 2);
          ctx.fill();
        }

        // Reset shadow
        ctx.shadowBlur = 0;
      }
    }

    // Mobile detection
    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
    }

    // Main simulation controller
    const Sim = {
      canvas: null,
      ctx: null,
      sim: null,
      densityCanvas: null,
      densityCtx: null,
      imageData: null,
      running: false,
      fps: 0,
      frameCount: 0,
      lastFpsTime: 0,

      init() {
        this.canvas = document.getElementById('simulationCanvas');
        this.ctx = this.canvas.getContext('2d');

        // Size canvas to fill container
        const wrapper = this.canvas.parentElement;
        this.canvas.width = wrapper.clientWidth;
        this.canvas.height = wrapper.clientHeight;

        CONFIG.WIDTH = this.canvas.width;
        CONFIG.HEIGHT = this.canvas.height;

        // Offscreen canvas for density rendering
        this.densityCanvas = document.createElement('canvas');
        this.densityCanvas.width = 150;
        this.densityCanvas.height = 150;
        this.densityCtx = this.densityCanvas.getContext('2d');
        this.imageData = this.densityCtx.createImageData(150, 150);

        this.sim = new TuringParticles(CONFIG.WIDTH, CONFIG.HEIGHT);
        this.render();
        this.loop();

        // Handle resize
        window.addEventListener('resize', () => this.resize());
      },

      resize() {
        const wrapper = this.canvas.parentElement;
        this.canvas.width = wrapper.clientWidth;
        this.canvas.height = wrapper.clientHeight;
        CONFIG.WIDTH = this.canvas.width;
        CONFIG.HEIGHT = this.canvas.height;
      },

      loop() {
        requestAnimationFrame(() => this.loop());

        // FPS calculation
        this.frameCount++;
        const now = performance.now();
        if (now - this.lastFpsTime >= 1000) {
          this.fps = this.frameCount;
          this.frameCount = 0;
          this.lastFpsTime = now;
          document.getElementById('fpsValue').textContent = this.fps;
          document.getElementById('countA').textContent = this.sim.particlesA.length;
          document.getElementById('countB').textContent = this.sim.particlesB.length;
        }

        if (this.running) {
          // Slower step for visible movement, scaled by speed
          this.sim.step(0.3 * CONFIG.speed);
        }

        this.render();
      },

      render() {
        if (CONFIG.renderMode === 'density') {
          this.sim.renderDensity(this.densityCtx, this.imageData);
          this.densityCtx.putImageData(this.imageData, 0, 0);
          // Scale up to main canvas
          this.ctx.imageSmoothingEnabled = true;
          this.ctx.drawImage(this.densityCanvas, 0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
        } else {
          this.sim.renderParticles(this.ctx);
        }
      },

      play() { this.running = true; },
      pause() { this.running = false; },
      reset() {
        this.sim = new TuringParticles(CONFIG.WIDTH, CONFIG.HEIGHT);
        this.render();
      }
    };

    // UI Setup
    document.addEventListener('DOMContentLoaded', () => {
      Sim.init();

      const overlay = document.getElementById('overlay');
      const hideOverlay = () => overlay.classList.remove('active');
      const showOverlay = () => overlay.classList.add('active');

      // Playback buttons
      document.getElementById('playBtn').onclick = () => { Sim.play(); hideOverlay(); };
      document.getElementById('pauseBtn').onclick = () => { Sim.pause(); showOverlay(); };
      document.getElementById('resetBtn').onclick = () => { Sim.pause(); Sim.reset(); showOverlay(); };
      document.getElementById('overlayPlay').onclick = () => { Sim.play(); hideOverlay(); };

      // Parameter sliders
      const sliders = [
        { id: 'diffusionA', key: 'DA', display: 'daValue', decimals: 2 },
        { id: 'diffusionB', key: 'DB', display: 'dbValue', decimals: 2 },
        { id: 'reactionRadius', key: 'r', display: 'radiusValue', decimals: 0 },
        { id: 'k1', key: 'k1', display: 'k1Value', decimals: 2 },
        { id: 'k2', key: 'k2', display: 'k2Value', decimals: 2 },
        { id: 'k3', key: 'k3', display: 'k3Value', decimals: 2 },
        { id: 'decayA', key: 'decayA', display: 'decayAValue', decimals: 3 },
        { id: 'decayB', key: 'decayB', display: 'decayBValue', decimals: 3 },
        { id: 'particleCount', key: 'initialParticles', display: 'particleCountValue', decimals: 0 },
        { id: 'simSpeed', key: 'speed', display: 'speedValue', decimals: 1 }
      ];

      sliders.forEach(({ id, key, display, decimals }) => {
        const el = document.getElementById(id);
        el.oninput = (e) => {
          CONFIG[key] = parseFloat(e.target.value);
          document.getElementById(display).textContent = decimals > 0 ? CONFIG[key].toFixed(decimals) : CONFIG[key];
        };
      });

      // Preset buttons
      document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
        btn.onclick = () => {
          const preset = PRESETS[btn.dataset.preset];
          if (preset) {
            Object.assign(CONFIG, preset);
            // Update UI with correct decimal places
            document.getElementById('diffusionA').value = CONFIG.DA;
            document.getElementById('daValue').textContent = CONFIG.DA.toFixed(2);
            document.getElementById('diffusionB').value = CONFIG.DB;
            document.getElementById('dbValue').textContent = CONFIG.DB.toFixed(2);
            document.getElementById('reactionRadius').value = CONFIG.r;
            document.getElementById('radiusValue').textContent = CONFIG.r;
            document.getElementById('k1').value = CONFIG.k1;
            document.getElementById('k1Value').textContent = CONFIG.k1.toFixed(2);
            document.getElementById('k2').value = CONFIG.k2;
            document.getElementById('k2Value').textContent = CONFIG.k2.toFixed(2);
            document.getElementById('k3').value = CONFIG.k3;
            document.getElementById('k3Value').textContent = CONFIG.k3.toFixed(2);
            document.getElementById('decayA').value = CONFIG.decayA;
            document.getElementById('decayAValue').textContent = CONFIG.decayA.toFixed(3);
            document.getElementById('decayB').value = CONFIG.decayB;
            document.getElementById('decayBValue').textContent = CONFIG.decayB.toFixed(3);
            Sim.reset();
          }
        };
      });

      // Render mode
      document.getElementById('renderMode').onchange = (e) => {
        CONFIG.renderMode = e.target.value;
      };

      // Color scheme
      document.getElementById('colorScheme').onchange = (e) => {
        CONFIG.colorScheme = e.target.value;
      };

      // Sidebar toggle
      const sidebar = document.getElementById('simulationSidebar');
      const toggle = document.getElementById('sidebarToggle');
      toggle.onclick = () => {
        sidebar.classList.toggle('collapsed');
        toggle.textContent = sidebar.classList.contains('collapsed') ? '\u2630' : '\u2715';
      };

      // Mobile buttons
      document.getElementById('mobileExpandBtn').onclick = () => sidebar.classList.remove('collapsed');
      document.getElementById('mobileCollapseBtn').onclick = () => sidebar.classList.add('collapsed');
    });
  </script>

  <script src="../../assets/js/main.js"></script>
</body>
