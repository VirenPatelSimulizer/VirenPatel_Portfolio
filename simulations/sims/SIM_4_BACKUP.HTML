  <script>
    /**
     * Chemical Kinetics Particle Simulator
     * Simulates chemical elements with bonding based on electronegativity and valence
     */

    // Global element data loaded from CSV
    let elementsData = [];
    let selectedElements = [null, null, null];

    const params = {
      element1Count: 30,
      element2Count: 30,
      element3Count: 0,
      particleSpeed: 100.0,
      radiusScale: 1.0,
      bondStrength: 1.0,
      temperature: 300,
      dt: 0.016,
      wallMode: 'solid',
      showBonds: true
    };

    const BASE_RADIUS = 5;
    const RESTITUTION = 1.0; // Elastic collisions
    const BOLTZMANN_CONSTANT = 8.617e-5; // eV/K

    // Mobile detection and scaling
    function isMobile() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
    }

    function getDeviceScale() {
      if (window.innerWidth <= 480) {
        return 0.6;
      } else if (window.innerWidth <= 768) {
        return 0.75;
      }
      return 1.0;
    }

    // Load elements from CSV
    async function loadElements() {
      try {
        const response = await fetch('elements.csv');
        const text = await response.text();
        const lines = text.trim().split('\n');
        const headers = lines[0].split(',');

        elementsData = [];
        for (let i = 1; i < lines.length; i++) {
          const values = lines[i].split(',');
          if (values.length < headers.length) continue;

          const element = {};
          headers.forEach((header, index) => {
            const value = values[index];
            if (header === 'symbol' || header === 'name' || header === 'bondType' || header === 'tendency') {
              element[header] = value;
            } else {
              element[header] = parseFloat(value);
            }
          });
          elementsData.push(element);
        }

        // Set default selected elements
        selectedElements[0] = elementsData.find(e => e.symbol === 'Na') || elementsData[0];
        selectedElements[1] = elementsData.find(e => e.symbol === 'Cl') || elementsData[1];
        selectedElements[2] = elementsData.find(e => e.symbol === 'H') || elementsData[2];

        return elementsData;
      } catch (error) {
        console.error('Error loading elements:', error);
        return [];
      }
    }

    // Calculate bond type between two elements
    function calculateBondProperties(elem1, elem2) {
      if (!elem1 || !elem2) return null;

      const enDiff = Math.abs(elem1.electronegativity - elem2.electronegativity);

      // Determine bond type based on electronegativity difference
      let bondType, strength;
      if (enDiff > 1.7) {
        // Ionic bond
        bondType = 'ionic';
        strength = 3.0;
      } else if (enDiff > 0.4) {
        // Polar covalent
        bondType = 'polar';
        strength = 2.0;
      } else {
        // Nonpolar covalent
        bondType = 'covalent';
        strength = 1.5;
      }

      // Check valence compatibility (simplified)
      const valenceCompatible = (elem1.valenceElectrons + elem2.valenceElectrons <= 8);

      return {
        bondType,
        strength: strength * (valenceCompatible ? 1.0 : 0.3),
        canBond: strength > 0.5,
        bondLength: (elem1.atomicNumber + elem2.atomicNumber) * 0.15
      };
    }

    class Particle {
      constructor(x, y, element, speed, id) {
        this.id = id || Date.now() + Math.random();
        this.pos = {x, y};
        this.vel = {x: 0, y: 0};
        this.force = {x: 0, y: 0};

        this.element = element;
        this.mass = element.mass;

        // Chemical properties
        this.maxBonds = element.maxBonds || 1;
        this.currentBonds = [];
        this.charge = 0;
        this.preferredCharge = element.preferredCharge || 0;

        // Molecule membership
        this.moleculeId = null;

        // Scale radius based on device and atomic number
        const deviceScale = getDeviceScale();
        const atomicScale = Math.pow(element.atomicNumber, 0.33) * 0.5;
        this.radius = params.radiusScale * BASE_RADIUS * atomicScale * deviceScale;

        // Random initial velocity based on temperature
        const angle = Math.random() * Math.PI * 2;
        const thermalSpeed = speed * Math.sqrt(params.temperature / 300);
        this.vel.x = Math.cos(angle) * thermalSpeed;
        this.vel.y = Math.sin(angle) * thermalSpeed;

        // Color from element data (using CSV color columns)
        this.color = {
          r: Math.round(element.color_r) || 255,
          g: Math.round(element.color_g) || 255,
          b: Math.round(element.color_b) || 255
        };
      }

      getAvailableBonds() {
        return this.maxBonds - this.currentBonds.length;
      }

      canBond() {
        return this.getAvailableBonds() > 0 && this.moleculeId === null;
      }

      getSpeed() {
        return Math.sqrt(this.vel.x * this.vel.x + this.vel.y * this.vel.y);
      }

      update(dt) {
        // Don't update position if part of a molecule (molecule handles it)
        if (this.moleculeId !== null) return;

        this.pos.x += this.vel.x * dt;
        this.pos.y += this.vel.y * dt;
      }

      handleBoundaries(width, height) {
        if (this.moleculeId !== null) return; // Molecule handles boundaries

        if (params.wallMode === 'solid') {
          if (this.pos.x - this.radius < 0) {
            this.pos.x = this.radius;
            this.vel.x = Math.abs(this.vel.x);
          } else if (this.pos.x + this.radius > width) {
            this.pos.x = width - this.radius;
            this.vel.x = -Math.abs(this.vel.x);
          }
          if (this.pos.y - this.radius < 0) {
            this.pos.y = this.radius;
            this.vel.y = Math.abs(this.vel.y);
          } else if (this.pos.y + this.radius > height) {
            this.pos.y = height - this.radius;
            this.vel.y = -Math.abs(this.vel.y);
          }
        } else if (params.wallMode === 'wrap') {
          if (this.pos.x < -this.radius) this.pos.x = width + this.radius;
          else if (this.pos.x > width + this.radius) this.pos.x = -this.radius;
          if (this.pos.y < -this.radius) this.pos.y = height + this.radius;
          else if (this.pos.y > height + this.radius) this.pos.y = -this.radius;
        }
      }

      draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
        ctx.fill();

        const shadowBlur = isMobile() ? 5 : 10;
        ctx.shadowBlur = shadowBlur;
        ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.6)`;

        // Draw element symbol
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${this.radius * 0.8}px Inter`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.element.symbol, this.pos.x, this.pos.y);

        // Draw charge indicator if charged
        if (this.charge !== 0) {
          ctx.font = `${this.radius * 0.5}px Inter`;
          const chargeStr = this.charge > 0 ? `+${this.charge}` : `${this.charge}`;
          ctx.fillText(chargeStr, this.pos.x + this.radius * 0.6, this.pos.y - this.radius * 0.6);
        }
      }
    }

    // Molecule class - represents bonded particles moving as a unit
    class Molecule {
      constructor(id, particles) {
        this.id = id;
        this.particleIds = particles.map(p => p.id);
        this.centerOfMass = {x: 0, y: 0};
        this.velocity = {x: 0, y: 0};
        this.mass = 0;
        this.formula = '';
        this.labelOpacity = 1.0;
        this.age = 0; // Track age for label fade

        this.updateProperties(particles);
      }

      updateProperties(particles) {
        const moleculeParticles = particles.filter(p => this.particleIds.includes(p.id));

        // Calculate center of mass
        let totalMass = 0;
        let comX = 0, comY = 0;

        for (const p of moleculeParticles) {
          comX += p.pos.x * p.mass;
          comY += p.pos.y * p.mass;
          totalMass += p.mass;
        }

        this.centerOfMass.x = comX / totalMass;
        this.centerOfMass.y = comY / totalMass;
        this.mass = totalMass;

        // Calculate average velocity (momentum conservation)
        let momX = 0, momY = 0;
        for (const p of moleculeParticles) {
          momX += p.vel.x * p.mass;
          momY += p.vel.y * p.mass;
        }

        this.velocity.x = momX / totalMass;
        this.velocity.y = momY / totalMass;

        // Generate chemical formula
        this.formula = this.generateFormula(moleculeParticles);
      }

      generateFormula(moleculeParticles) {
        const elementCounts = {};
        for (const p of moleculeParticles) {
          const symbol = p.element.symbol;
          elementCounts[symbol] = (elementCounts[symbol] || 0) + 1;
        }

        let formula = '';
        for (const [symbol, count] of Object.entries(elementCounts)) {
          formula += symbol + (count > 1 ? count : '');
        }
        return formula;
      }

      update(particles, dt) {
        const moleculeParticles = particles.filter(p => this.particleIds.includes(p.id));

        // Increment age for label fade
        this.age += dt;
        if (this.age > 2.0 && this.labelOpacity > 0) {
          // Start fading after 2 seconds
          this.labelOpacity -= dt * 0.5; // Fade over 2 seconds
          if (this.labelOpacity < 0) this.labelOpacity = 0;
        }

        // Store relative positions BEFORE updating COM
        const relativePositions = moleculeParticles.map(p => ({
          id: p.id,
          dx: p.pos.x - this.centerOfMass.x,
          dy: p.pos.y - this.centerOfMass.y
        }));

        // Update center of mass position based on velocity
        this.centerOfMass.x += this.velocity.x * dt;
        this.centerOfMass.y += this.velocity.y * dt;

        // Update particle positions to maintain structure relative to new COM
        for (const p of moleculeParticles) {
          const rel = relativePositions.find(r => r.id === p.id);
          p.pos.x = this.centerOfMass.x + rel.dx;
          p.pos.y = this.centerOfMass.y + rel.dy;
          // Important: set particle velocity to molecule velocity
          p.vel.x = this.velocity.x;
          p.vel.y = this.velocity.y;
        }
      }

      handleBoundaries(particles, width, height) {
        const moleculeParticles = particles.filter(p => this.particleIds.includes(p.id));

        if (params.wallMode === 'solid') {
          // Find the extent of the molecule
          let minX = Infinity, maxX = -Infinity;
          let minY = Infinity, maxY = -Infinity;

          for (const p of moleculeParticles) {
            minX = Math.min(minX, p.pos.x - p.radius);
            maxX = Math.max(maxX, p.pos.x + p.radius);
            minY = Math.min(minY, p.pos.y - p.radius);
            maxY = Math.max(maxY, p.pos.y + p.radius);
          }

          // Bounce off walls
          if (minX < 0 || maxX > width) {
            this.velocity.x = -this.velocity.x;
            this.centerOfMass.x += this.velocity.x * 0.01;
          }
          if (minY < 0 || maxY > height) {
            this.velocity.y = -this.velocity.y;
            this.centerOfMass.y += this.velocity.y * 0.01;
          }
        }
      }

      draw(ctx, particles) {
        // Only draw label if opacity > 0
        if (this.labelOpacity <= 0) return;

        const moleculeParticles = particles.filter(p => this.particleIds.includes(p.id));
        if (moleculeParticles.length === 0) return;

        // Calculate current center from particle positions
        let centerX = 0, centerY = 0;
        for (const p of moleculeParticles) {
          centerX += p.pos.x;
          centerY += p.pos.y;
        }
        centerX /= moleculeParticles.length;
        centerY /= moleculeParticles.length;

        // Draw molecule label with fade effect
        ctx.shadowBlur = 0;
        ctx.fillStyle = `rgba(255, 255, 100, ${this.labelOpacity * 0.8})`;
        ctx.font = `bold ${isMobile() ? 10 : 12}px Inter`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';

        // Find highest particle position to place label above molecule
        let minY = Math.min(...moleculeParticles.map(p => p.pos.y - p.radius));
        ctx.fillText(this.formula, centerX, minY - 5);
      }
    }

    let particles = [];
    let bonds = [];
    let molecules = [];
    let nextMoleculeId = 1;
    let nextParticleId = 1;

    // Reaction rules database
    const reactionRules = [
      {
        // H2O formation: 2H + O → H2O
        name: 'Water Formation',

    // ========================================
    // CHEMICAL KINETICS COLLISION ENGINE
    // ========================================

    /**
     * Calculate kinetic energy of collision
     * Returns energy in kJ/mol equivalent scale
     */
    function getCollisionEnergy(p1, p2) {
      // Relative velocity
      const dvx = p1.vel.x - p2.vel.x;
      const dvy = p1.vel.y - p2.vel.y;
      const relativeSpeed = Math.sqrt(dvx * dvx + dvy * dvy);

      // Reduced mass
      const reducedMass = (p1.mass * p2.mass) / (p1.mass + p2.mass);

      // Kinetic energy in collision (converted to kJ/mol scale)
      const kineticEnergy = 0.5 * reducedMass * relativeSpeed * relativeSpeed * 0.01;

      return kineticEnergy;
    }

    /**
     * Main collision resolution function
     * Determines reaction type and applies chemistry
     * NOW SUPPORTS: Molecules reacting with atoms or other molecules!
     */
    function resolveCollision(a, b, collisionEnergy, temperature) {
      // Check if particles have available bonding capacity
      const vacanciesA = a.getAvailableBonds();
      const vacanciesB = b.getAvailableBonds();

      // ✅ ALLOW MOLECULES TO REACT if they have available bonds
      // Example: H2O can add another H to become H3O+
      if (vacanciesA <= 0 && vacanciesB <= 0) {
        return elasticScatter(a, b, collisionEnergy);
      }

      // If one or both are in molecules, check if they can still react
      const aInMolecule = a.moleculeId !== null;
      const bInMolecule = b.moleculeId !== null;

      // Don't allow particles in the SAME molecule to react again
      if (aInMolecule && bInMolecule && a.moleculeId === b.moleculeId) {
        return elasticScatter(a, b, collisionEnergy);
      }

      // Step 1: Calculate electronegativity difference
      const deltaEN = Math.abs(a.element.electronegativity - b.element.electronegativity);

      // Step 2: Determine bond type
      const bothMetals = (a.element.tendency === 'Metal' && b.element.tendency === 'Metal');
      const isIonic = deltaEN >= 1.8 ||
                      (a.element.bondType.includes('Ionic') || b.element.bondType.includes('Ionic'));
      const isPolarCovalent = deltaEN >= 0.4 && deltaEN < 1.8;
      const isNonPolarCovalent = deltaEN < 0.4;

      // Step 3: Calculate reaction probability
      let reactionProbability = 0;
      let reactionType = 'none';

      if (bothMetals) {
        reactionType = 'metallic';
        reactionProbability = clamp(0.1 + 0.03 * collisionEnergy, 0, 0.6);
      } else if (isIonic && deltaEN >= 1.8) {
        reactionType = 'ionic';
        reactionProbability = clamp(0.2 + 0.05 * collisionEnergy + 0.3 * (deltaEN / 4), 0, 1);
      } else if (isPolarCovalent || isNonPolarCovalent) {
        reactionType = isPolarCovalent ? 'polar_covalent' : 'covalent';
        const vacancyFactor = (vacanciesA + vacanciesB) / 8;
        reactionProbability = clamp(0.15 + 0.04 * collisionEnergy + 0.2 * vacancyFactor, 0, 1);
      }

      // Apply temperature effect (Arrhenius-like)
      const tempFactor = temperature / 300; // Normalized to room temp
      reactionProbability *= Math.sqrt(tempFactor);

      // Step 4: Stochastic check
      if (Math.random() > reactionProbability) {
        return elasticScatter(a, b, collisionEnergy);
      }

      // Step 5: Apply reaction logic based on type
      switch (reactionType) {
        case 'metallic':
          return formMetallicCluster(a, b);
        case 'ionic':
          return createIonicBond(a, b, deltaEN);
        case 'polar_covalent':
        case 'covalent':
          return formCovalentBond(a, b, reactionType === 'polar_covalent' ? deltaEN : 0);
        default:
          return elasticScatter(a, b, collisionEnergy);
      }
    }

    /**
     * Clamp utility function
     */
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    /**
     * Form covalent bond by sharing electrons
     */
    function formCovalentBond(a, b, deltaEN) {
      // Calculate available vacancies
      const vacanciesA = a.getAvailableBonds();
      const vacanciesB = b.getAvailableBonds();

      // Determine number of shared electron pairs
      const sharedPairs = Math.min(vacanciesA, vacanciesB, 3); // Max triple bond

      if (sharedPairs <= 0) return false;

      // Determine bond order (single, double, triple)
      let bondFormula = '';
      if (sharedPairs === 1) bondFormula = `${a.element.symbol}-${b.element.symbol}`;
      else if (sharedPairs === 2) bondFormula = `${a.element.symbol}=${b.element.symbol}`;
      else if (sharedPairs === 3) bondFormula = `${a.element.symbol}≡${b.element.symbol}`;

      // Add partial charges for polar covalent
      if (deltaEN > 0.4) {
        const delta = deltaEN * 0.3; // Partial charge magnitude
        if (a.element.electronegativity > b.element.electronegativity) {
          a.charge -= delta;
          b.charge += delta;
        } else {
          a.charge += delta;
          b.charge -= delta;
        }
      }

      // Create molecule
      const reactants = [
        { symbol: a.element.symbol, count: 1 },
        { symbol: b.element.symbol, count: 1 }
      ];
      const structure = [a.element.symbol, b.element.symbol];

      const rule = {
        name: `${bondFormula} Formation`,
        reactants: reactants,
        products: [{ formula: bondFormula, structure: structure }],
        activationEnergy: 20 + deltaEN * 10,
        energyChange: -100 * sharedPairs,
        bondType: deltaEN > 0.4 ? 'polar' : 'covalent',
        requiresValence: true
      };

      createMolecule([a, b], rule);

      console.log(`✓ Covalent: ${bondFormula} ${deltaEN > 0.4 ? '(polar)' : ''}`);
      return true;
    }

    /**
     * Create ionic bond via electron transfer
     */
    function createIonicBond(a, b, deltaEN) {
      // Identify donor (lower EN) and acceptor (higher EN)
      let donor = a.element.electronegativity < b.element.electronegativity ? a : b;
      let acceptor = donor === a ? b : a;

      // Calculate electron transfer
      const donorAvailable = donor.element.valenceElectrons - donor.currentBonds.length;
      const acceptorVacancies = acceptor.getAvailableBonds();

      const electronsToTransfer = Math.min(donorAvailable, acceptorVacancies, 3);

      if (electronsToTransfer <= 0) return false;

      // Transfer electrons (update charges)
      donor.charge += electronsToTransfer;
      acceptor.charge -= electronsToTransfer;

      // Create ionic molecule
      const formula = `${donor.element.symbol}${acceptor.element.symbol}`;
      const rule = {
        name: `${formula} Formation (Ionic)`,
        reactants: [
          { symbol: donor.element.symbol, count: 1 },
          { symbol: acceptor.element.symbol, count: 1 }
        ],
        products: [{ formula: formula, structure: [donor.element.symbol, acceptor.element.symbol] }],
        activationEnergy: 5,
        energyChange: -400,
        bondType: 'ionic',
        requiresValence: true
      };

      createMolecule([donor, acceptor], rule);

      console.log(`✓ Ionic: ${donor.element.symbol}⁺${Math.abs(donor.charge)} + ${acceptor.element.symbol}⁻${Math.abs(acceptor.charge)} → ${formula}`);
      return true;
    }

    /**
     * Form metallic cluster (weak bonds, electron sea)
     */
    function formMetallicCluster(a, b) {
      // Metallic bonding - minimal electron transfer, delocalized electrons
      const formula = `${a.element.symbol}${b.element.symbol}`;

      const rule = {
        name: `${formula} Metallic Cluster`,
        reactants: [
          { symbol: a.element.symbol, count: 1 },
          { symbol: b.element.symbol, count: 1 }
        ],
        products: [{ formula: formula, structure: [a.element.symbol, b.element.symbol] }],
        activationEnergy: 10,
        energyChange: -50,
        bondType: 'metallic',
        requiresValence: false
      };

      // Slight charge delocalization
      const avgCharge = (a.charge + b.charge) / 2;
      a.charge = avgCharge;
      b.charge = avgCharge;

      createMolecule([a, b], rule);

      console.log(`✓ Metallic: ${a.element.symbol} + ${b.element.symbol} → ${formula} cluster`);
      return true;
    }

    /**
     * Elastic scatter - no reaction
     */
    function elasticScatter(a, b, collisionEnergy) {
      // Particles bounce off without reacting
      // Physics already handled in handleCollisions()
      return false;
    }

    /**
     * Optional: Break existing bond if collision energy is very high
     */
    function breakBond(a, b, collisionEnergy) {
      const BOND_BREAK_THRESHOLD = 200; // kJ/mol

      if (collisionEnergy < BOND_BREAK_THRESHOLD) return false;

      // Check if a and b are in the same molecule
      if (a.moleculeId !== null && a.moleculeId === b.moleculeId) {
        const moleculeId = a.moleculeId;

        // Remove molecule
        molecules = molecules.filter(m => m.id !== moleculeId);

        // Free particles
        a.moleculeId = null;
        b.moleculeId = null;
        a.currentBonds = a.currentBonds.filter(id => id !== b.id);
        b.currentBonds = b.currentBonds.filter(id => id !== a.id);
        a.charge = 0;
        b.charge = 0;

        console.log(`✗ Bond broken: ${a.element.symbol}-${b.element.symbol} (${collisionEnergy.toFixed(1)} kJ/mol)`);
        return true;
      }

      return false;
    }

    // Check if reaction is electronegatively favorable
    function isElectronegativelyCompatible(reactants, rule) {
      if (rule.bondType === 'ionic') {
        // Ionic bonds need high electronegativity difference
        const enDiffs = [];
        for (let i = 0; i < reactants.length; i++) {
          for (let j = i + 1; j < reactants.length; j++) {
            const enDiff = Math.abs(reactants[i].element.electronegativity - reactants[j].element.electronegativity);
            enDiffs.push(enDiff);
          }
        }
        // Need at least one pair with EN diff > 1.7 for ionic
        return enDiffs.some(diff => diff > 1.7);
      } else if (rule.bondType === 'covalent') {
        // Covalent bonds need compatible electronegativity (not too different)
        const enDiffs = [];
        for (let i = 0; i < reactants.length; i++) {
          for (let j = i + 1; j < reactants.length; j++) {
            const enDiff = Math.abs(reactants[i].element.electronegativity - reactants[j].element.electronegativity);
            enDiffs.push(enDiff);
          }
        }
        // All pairs should have EN diff < 2.0 for covalent
        return enDiffs.every(diff => diff < 2.0);
      }
      return true;
    }

    // Check if particles have available valence
    function hasAvailableValence(particles, rule) {
      if (!rule.requiresValence) return true;

      // Check if all particles have available bonds
      for (const p of particles) {
        if (p.getAvailableBonds() <= 0) {
          return false;
        }
      }
      return true;
    }

    // Calculate Arrhenius reaction probability
    function getReactionProbability(collisionEnergy, activationEnergy, temperature) {
      // Arrhenius equation: k = A * e^(-Ea/RT)
      // R = 8.314 J/(mol·K) = 0.008314 kJ/(mol·K)
      const R = 0.008314;
      const A = 1.0; // Pre-exponential factor (normalized)

      // Temperature effect on activation energy
      const effectiveEa = activationEnergy * (300 / temperature); // Scale Ea by temperature

      // If collision energy exceeds activation energy, increase probability
      if (collisionEnergy >= effectiveEa) {
        return Math.min(0.95, A * Math.exp(-(effectiveEa - collisionEnergy) / (R * temperature)));
      } else {
        // Arrhenius probability if below activation energy
        return A * Math.exp(-effectiveEa / (R * temperature));
      }
    }

    // Check for chemical reactions on collision
    function checkReactions() {
      const REACTION_DISTANCE = 30; // Distance threshold for reaction

      for (let i = 0; i < particles.length; i++) {
        const pi = particles[i];

        for (let j = i + 1; j < particles.length; j++) {
          const pj = particles[j];

          // ✅ NOW CHECKS ALL PAIRS (including molecules)
          // Skip only if both are in the SAME molecule
          if (pi.moleculeId !== null && pi.moleculeId === pj.moleculeId) {
            continue;
          }

          // Calculate distance
          const dx = pj.pos.x - pi.pos.x;
          const dy = pj.pos.y - pi.pos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          // Check if particles are close enough
          if (dist < REACTION_DISTANCE) {
            // Calculate collision energy
            const collisionEnergy = getCollisionEnergy(pi, pj);

            // ✅ USE NEW COLLISION ENGINE
            // Can now handle: atom+atom, atom+molecule, molecule+molecule
            resolveCollision(pi, pj, collisionEnergy, params.temperature);

            // Optional: Check for bond breaking at very high energies
            if (collisionEnergy > 150) {
              breakBond(pi, pj, collisionEnergy);
            }
          }
        }
      }
    }

    // Attempt to create a reaction from nearby particles
    function tryReaction(nearbyParticles, collisionEnergy) {
      // Check each reaction rule
      for (const rule of reactionRules) {
        // Count available reactants
        const available = {};
        const particlesBySymbol = {};

        for (const p of nearbyParticles) {
          if (p.moleculeId !== null) continue;

          const symbol = p.element.symbol;
          available[symbol] = (available[symbol] || 0) + 1;

          if (!particlesBySymbol[symbol]) {
            particlesBySymbol[symbol] = [];
          }
          particlesBySymbol[symbol].push(p);
        }

        // Check if we have enough reactants
        let canReact = true;
        for (const reactant of rule.reactants) {
          if ((available[reactant.symbol] || 0) < reactant.count) {
            canReact = false;
            break;
          }
        }

        if (!canReact) continue;

        // Collect particles for reaction
        const reactingParticles = [];
        for (const reactant of rule.reactants) {
          const needed = reactant.count;
          const particlesOfType = particlesBySymbol[reactant.symbol];
          for (let i = 0; i < needed && i < particlesOfType.length; i++) {
            reactingParticles.push(particlesOfType[i]);
          }
        }

        if (reactingParticles.length === 0) continue;

        // ✅ NEW: Check valence availability
        if (!hasAvailableValence(reactingParticles, rule)) {
          continue; // Skip if particles don't have available bonds
        }

        // ✅ NEW: Check electronegativity compatibility
        if (!isElectronegativelyCompatible(reactingParticles, rule)) {
          continue; // Skip if bond type not compatible with electronegativity
        }

        // ✅ NEW: Calculate reaction probability based on Arrhenius equation
        const reactionProb = getReactionProbability(
          collisionEnergy,
          rule.activationEnergy,
          params.temperature
        );

        // ✅ NEW: Stochastic check with temperature-dependent probability
        if (Math.random() > reactionProb) {
          continue; // Reaction doesn't occur this time
        }

        // All checks passed - create molecule!
        createMolecule(reactingParticles, rule);
        return true;
      }

      return false;
    }

    // Create a molecule from reacting particles
    function createMolecule(reactingParticles, rule) {
      // ✅ CHECK IF ANY PARTICLES ARE ALREADY IN MOLECULES
      const existingMolecules = new Set();
      const newParticles = [];

      for (const p of reactingParticles) {
        if (p.moleculeId !== null) {
          existingMolecules.add(p.moleculeId);
        } else {
          newParticles.push(p);
        }
      }

      let moleculeId;

      // If particles from existing molecule(s), merge/expand
      if (existingMolecules.size > 0) {
        // Use first existing molecule ID
        moleculeId = [...existingMolecules][0];

        // Remove old molecules
        for (const oldId of existingMolecules) {
          const oldMol = molecules.find(m => m.id === oldId);
          if (oldMol) {
            // Add all particles from old molecule
            for (const pid of oldMol.particleIds) {
              const particle = particles.find(p => p.id === pid);
              if (particle && !reactingParticles.includes(particle)) {
                reactingParticles.push(particle);
              }
            }
          }
        }

        // Remove old molecule objects
        molecules = molecules.filter(m => !existingMolecules.has(m.id));
      } else {
        // All new particles - create new molecule
        moleculeId = nextMoleculeId++;
      }

      // Calculate center of mass and average velocity
      let totalMass = 0;
      let comX = 0, comY = 0;
      let momX = 0, momY = 0;

      for (const p of reactingParticles) {
        comX += p.pos.x * p.mass;
        comY += p.pos.y * p.mass;
        momX += p.vel.x * p.mass;
        momY += p.vel.y * p.mass;
        totalMass += p.mass;
      }

      comX /= totalMass;
      comY /= totalMass;
      const avgVelX = momX / totalMass;
      const avgVelY = momY / totalMass;

      // Mark particles as part of molecule and update their bonds
      for (const p of reactingParticles) {
        p.moleculeId = moleculeId;

        // Mark bonds as used (add other particles in molecule to currentBonds)
        for (const other of reactingParticles) {
          if (other.id !== p.id && !p.currentBonds.includes(other.id)) {
            p.currentBonds.push(other.id);
          }
        }
      }

      // Arrange particles in molecular structure around COM
      if (rule.products[0].structure) {
        arrangeMolecularStructure(reactingParticles, rule.products[0].structure, comX, comY);
      }

      // Handle ionic bonding (charge transfer)
      if (rule.name.includes('Sodium Chloride')) {
        const na = reactingParticles.find(p => p.element.symbol === 'Na');
        const cl = reactingParticles.find(p => p.element.symbol === 'Cl');
        if (na && cl) {
          na.charge = +1;
          cl.charge = -1;
        }
      }

      // Create molecule object (it will recalculate COM from arranged positions)
      const molecule = new Molecule(moleculeId, reactingParticles);

      // Set velocity from conserved momentum
      molecule.velocity.x = avgVelX;
      molecule.velocity.y = avgVelY;

      // Apply particle velocities
      for (const p of reactingParticles) {
        p.vel.x = molecule.velocity.x;
        p.vel.y = molecule.velocity.y;
      }

      molecules.push(molecule);

      // Apply energy change (affects velocity)
      if (rule.energyChange < 0) {
        // Exothermic - release energy as kinetic energy
        const speedBoost = Math.sqrt(Math.abs(rule.energyChange) * 0.001);
        molecule.velocity.x += (Math.random() - 0.5) * speedBoost;
        molecule.velocity.y += (Math.random() - 0.5) * speedBoost;
      }
    }

    // Arrange particles in molecular geometry
    function arrangeMolecularStructure(particles, structure, centerX, centerY) {
      if (particles.length !== structure.length) return;

      // Sort particles to match structure order
      const sortedParticles = [];
      for (const symbol of structure) {
        const p = particles.find(p => p.element.symbol === symbol && !sortedParticles.includes(p));
        if (p) sortedParticles.push(p);
      }

      // Use provided center (calculated from pre-reaction positions)
      // Arrange in a line or angle depending on structure
      if (sortedParticles.length === 2) {
        // Linear molecule (H2, O2, NaCl)
        const spacing = 15;
        sortedParticles[0].pos.x = centerX - spacing / 2;
        sortedParticles[0].pos.y = centerY;
        sortedParticles[1].pos.x = centerX + spacing / 2;
        sortedParticles[1].pos.y = centerY;
      } else if (sortedParticles.length === 3) {
        // Bent or linear molecule (H2O, CO2)
        const spacing = 18;
        if (structure.includes('H') && structure.includes('O')) {
          // H2O - bent structure (104.5° angle)
          sortedParticles[0].pos.x = centerX - spacing * 0.8;
          sortedParticles[0].pos.y = centerY + spacing * 0.5;
          sortedParticles[1].pos.x = centerX; // O in center
          sortedParticles[1].pos.y = centerY;
          sortedParticles[2].pos.x = centerX + spacing * 0.8;
          sortedParticles[2].pos.y = centerY + spacing * 0.5;
        } else {
          // CO2 - linear structure
          sortedParticles[0].pos.x = centerX - spacing;
          sortedParticles[0].pos.y = centerY;
          sortedParticles[1].pos.x = centerX;
          sortedParticles[1].pos.y = centerY;
          sortedParticles[2].pos.x = centerX + spacing;
          sortedParticles[2].pos.y = centerY;
        }
      }
    }

    function updateBonds() {
      if (!params.showBonds) {
        bonds = [];
        return;
      }

      bonds = [];

      // Check all particle pairs for bonding
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const pi = particles[i];
          const pj = particles[j];

          // Calculate bond properties
          const bondProps = calculateBondProperties(pi.element, pj.element);
          if (!bondProps || !bondProps.canBond) continue;

          // Calculate distance
          const dx = pj.pos.x - pi.pos.x;
          const dy = pj.pos.y - pi.pos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          // Bond forms if particles are close enough OR in same molecule
          const bondDistance = bondProps.bondLength * params.bondStrength * 8;
          const inSameMolecule = pi.moleculeId !== null && pi.moleculeId === pj.moleculeId;

          if (dist <= bondDistance || inSameMolecule) {
            bonds.push({
              i,
              j,
              type: bondProps.bondType,
              strength: bondProps.strength
            });
          }
        }
      }
    }

    function initParticles(canvas) {
      particles = [];
      molecules = [];
      nextParticleId = 1;
      nextMoleculeId = 1;

      function isValidPosition(x, y, radius) {
        for (let p of particles) {
          const dx = x - p.pos.x;
          const dy = y - p.pos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < radius + p.radius + 5) {
            return false;
          }
        }
        return true;
      }

      // Create particles for each selected element
      const elementCounts = [
        {element: selectedElements[0], count: params.element1Count},
        {element: selectedElements[1], count: params.element2Count},
        {element: selectedElements[2], count: params.element3Count}
      ];

      for (const {element, count} of elementCounts) {
        if (!element || count === 0) continue;

        for (let i = 0; i < count; i++) {
          let attempts = 0;
          let x, y;
          const atomicScale = Math.pow(element.atomicNumber, 0.33) * 0.5;
          const radius = params.radiusScale * BASE_RADIUS * atomicScale;

          do {
            x = radius * 2 + Math.random() * (canvas.width - 4 * radius);
            y = radius * 2 + Math.random() * (canvas.height - 4 * radius);
            attempts++;
          } while (!isValidPosition(x, y, radius) && attempts < 100);

          if (attempts < 100) {
            particles.push(new Particle(x, y, element, params.particleSpeed, nextParticleId++));
          }
        }
      }
    }

    function computeForces() {
      const MAX_FORCE = 10;
      const FORCE_STRENGTH = 800;
      const IONIC_FORCE_STRENGTH = 1200; // Stronger ionic attraction

      // Reset all forces
      for (let p of particles) {
        p.force.x = 0;
        p.force.y = 0;
      }

      // Calculate forces between all particle pairs
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const pi = particles[i];
          const pj = particles[j];

          // Calculate distance
          const dx = pj.pos.x - pi.pos.x;
          const dy = pj.pos.y - pi.pos.y;
          const distSq = dx * dx + dy * dy;
          const dist = Math.sqrt(distSq);

          if (dist < 0.1) continue;

          let forceMag = 0;

          // ✅ IONIC ATTRACTION: Opposite charges attract, like charges repel
          const chargeProduct = pi.charge * pj.charge;
          if (Math.abs(chargeProduct) > 0.01) {
            // Coulomb's law: F = k * q1 * q2 / r²
            const ionicForce = -(IONIC_FORCE_STRENGTH * chargeProduct) / distSq;
            forceMag += ionicForce;
          }

          // Check if in same molecule (covalent bond with fixed distance)
          const inSameMolecule = pi.moleculeId !== null && pi.moleculeId === pj.moleculeId;

          if (inSameMolecule) {
            // ✅ FIXED COVALENT BOND DISTANCE
            const targetDist = 15; // Fixed bond length in pixels
            const springConstant = 5.0;

            // Hooke's law spring force: F = -k(x - x0)
            const displacement = dist - targetDist;
            forceMag += springConstant * displacement / dist;
          } else {
            // Not in same molecule - calculate bond properties
            const bondProps = calculateBondProperties(pi.element, pj.element);

            if (bondProps && bondProps.canBond) {
              // Attractive force based on electronegativity difference
              const enDiff = Math.abs(pi.element.electronegativity - pj.element.electronegativity);
              const equilibriumDist = bondProps.bondLength * 8;

              // Lennard-Jones-like potential
              if (dist < equilibriumDist) {
                // Repulsion when too close
                forceMag += (FORCE_STRENGTH * bondProps.strength * 0.5) / distSq;
              } else {
                // Attraction when farther
                const attraction = -bondProps.strength * enDiff * 0.3;
                forceMag += (attraction * FORCE_STRENGTH) / distSq;
              }
            } else {
              // Repulsion for non-bonding elements
              forceMag += (FORCE_STRENGTH * 0.2) / distSq;
            }
          }

          // Clamp force
          forceMag = Math.max(-MAX_FORCE, Math.min(MAX_FORCE, forceMag));

          // Normalize direction
          const nx = dx / dist;
          const ny = dy / dist;

          // Apply force (negative for attraction, positive for repulsion)
          const fx = -nx * forceMag;
          const fy = -ny * forceMag;

          pi.force.x += fx;
          pi.force.y += fy;
          pj.force.x -= fx;
          pj.force.y -= fy;
        }
      }
    }

    function handleCollisions() {
      // Check all particle pairs for collisions
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const pi = particles[i];
          const pj = particles[j];

          // Calculate distance between particles
          const dx = pj.pos.x - pi.pos.x;
          const dy = pj.pos.y - pi.pos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = pi.radius + pj.radius;

          // Check if particles are overlapping
          if (dist < minDist && dist > 0) {
            // Collision normal (normalized direction vector)
            const nx = dx / dist;
            const ny = dy / dist;

            // Separate particles to prevent overlap
            const overlap = minDist - dist;
            const separationX = nx * overlap * 0.5;
            const separationY = ny * overlap * 0.5;

            pi.pos.x -= separationX;
            pi.pos.y -= separationY;
            pj.pos.x += separationX;
            pj.pos.y += separationY;

            // Calculate relative velocity
            const dvx = pj.vel.x - pi.vel.x;
            const dvy = pj.vel.y - pi.vel.y;

            // Calculate relative velocity in collision normal direction
            const dvn = dvx * nx + dvy * ny;

            // Only resolve if particles are moving towards each other
            if (dvn < 0) {
              // Calculate impulse scalar (for equal mass elastic collision)
              const impulse = -(1 + RESTITUTION) * dvn / (1/pi.mass + 1/pj.mass);

              // Apply impulse to both particles
              const impulseX = impulse * nx;
              const impulseY = impulse * ny;

              pi.vel.x -= impulseX / pi.mass;
              pi.vel.y -= impulseY / pi.mass;
              pj.vel.x += impulseX / pj.mass;
              pj.vel.y += impulseY / pj.mass;
            }
          }
        }
      }
    }

    function step(dt, canvas) {
      // Check for chemical reactions
      checkReactions();

      // Update molecules
      for (const molecule of molecules) {
        molecule.update(particles, dt);
        molecule.handleBoundaries(particles, canvas.width, canvas.height);
      }

      // Compute forces between particles (only free particles)
      computeForces();

      // Apply forces to update velocities (only free particles)
      for (let p of particles) {
        if (p.moleculeId === null) {
          p.vel.x += (p.force.x / p.mass) * dt;
          p.vel.y += (p.force.y / p.mass) * dt;
        }
      }

      // Update all particle positions (only free particles, molecules update their own)
      for (let p of particles) {
        p.update(dt);
      }

      // Handle particle-particle collisions (only free particles)
      handleCollisions();

      // Handle boundary collisions (only free particles)
      for (let p of particles) {
        p.handleBoundaries(canvas.width, canvas.height);
      }

      // Update bonds between particles
      updateBonds();
    }

    function setParams(newParams) {
      Object.assign(params, newParams);
    }

    function reset(canvas) {
      initParticles(params.particleACount, params.particleBCount, params.speedA, params.speedB, canvas);
    }

    const Simulation = {
      canvas: null,
      ctx: null,
      isPaused: true,
      lastTime: 0,
      fps: 60,
      frameCount: 0,
      fpsTime: 0,
      spawnTimer: 0,
      secondGroupSpawned: false,

      init(canvasElement, initialParams) {
        this.canvas = canvasElement;
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        Object.assign(params, initialParams);
        this.createParticles();
        this.lastTime = performance.now();
        this.animate();
      },

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;

        // Update particle radii on resize for mobile responsiveness
        const deviceScale = getDeviceScale();
        for (let p of particles) {
          p.radius = params.radiusScale * BASE_RADIUS * deviceScale;
        }
      },

      createParticles() {
        initParticles(this.canvas);
      },

      animate() {
        requestAnimationFrame(() => this.animate());
        const currentTime = performance.now();
        const deltaTime = (currentTime - this.lastTime) / 1000;
        this.lastTime = currentTime;

        this.frameCount++;
        this.fpsTime += deltaTime;
        if (this.fpsTime >= 1) {
          this.fps = Math.round(this.frameCount / this.fpsTime);
          this.frameCount = 0;
          this.fpsTime = 0;
        }

        if (!this.isPaused) {
          this.update(deltaTime);
        }
        this.draw();
        this.updateStats();
      },

      update(dt) {
        dt = Math.min(dt, 0.033);
        step(params.dt, this.canvas);
      },

      draw() {
        this.ctx.fillStyle = 'rgba(10, 10, 10, 1)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw bonds first (behind particles)
        if (params.showBonds && bonds.length > 0) {
          this.ctx.lineWidth = isMobile() ? 1.5 : 2.5;
          for (const bond of bonds) {
            const pi = particles[bond.i];
            const pj = particles[bond.j];

            // Color based on bond type with improved visuals
            if (bond.type === 'ionic') {
              this.ctx.strokeStyle = 'rgba(255, 50, 255, 0.7)'; // Bright purple for ionic
              this.ctx.lineWidth = isMobile() ? 2 : 3; // Thicker for ionic
            } else if (bond.type === 'polar') {
              this.ctx.strokeStyle = 'rgba(100, 255, 150, 0.6)'; // Green-cyan for polar
              this.ctx.lineWidth = isMobile() ? 1.5 : 2.5;
            } else if (bond.type === 'metallic') {
              this.ctx.strokeStyle = 'rgba(200, 200, 255, 0.5)'; // Silver-blue for metallic
              this.ctx.lineWidth = isMobile() ? 1 : 1.5; // Thinner for metallic
              this.ctx.setLineDash([5, 3]); // Dashed line for metallic
            } else {
              this.ctx.strokeStyle = 'rgba(255, 255, 100, 0.6)'; // Yellow for covalent
              this.ctx.lineWidth = isMobile() ? 1.5 : 2.5;
            }

            this.ctx.beginPath();
            this.ctx.moveTo(pi.pos.x, pi.pos.y);
            this.ctx.lineTo(pj.pos.x, pj.pos.y);
            this.ctx.stroke();
            this.ctx.setLineDash([]); // Reset dash
          }
        }

        // Draw all particles
        for (const p of particles) {
          p.draw(this.ctx);
        }

        // Draw molecule labels
        for (const molecule of molecules) {
          molecule.draw(this.ctx, particles);
        }

        this.ctx.shadowBlur = 0;
      },

      updateStats() {
        document.getElementById('fpsValue').textContent = this.fps;

        let totalSpeed = 0;
        let freeParticles = 0;
        for (const p of particles) {
          totalSpeed += p.getSpeed();
          if (p.moleculeId === null) freeParticles++;
        }
        const avgSpeed = particles.length > 0 ? (totalSpeed / particles.length).toFixed(1) : 0;

        document.getElementById('totalParticles').textContent = `${freeParticles}/${particles.length}`;
        document.getElementById('totalBonds').textContent = `${molecules.length} mol`;
        document.getElementById('avgSpeed').textContent = avgSpeed;
      },

      reset() {
        this.pause();
        this.createParticles();
        this.draw();
      },

      pause() {
        this.isPaused = true;
      },

      play() {
        this.isPaused = false;
        this.lastTime = performance.now();
      }
    };

    // UI Controller

        const bondStrengthInput = document.getElementById('bondStrength');
        const bondStrengthValue = document.getElementById('bondStrengthValue');
        bondStrengthInput.addEventListener('input', (e) => {
          params.bondStrength = parseFloat(e.target.value);
          bondStrengthValue.textContent = params.bondStrength.toFixed(1);
        });

        const temperatureInput = document.getElementById('temperature');
        const temperatureValue = document.getElementById('temperatureValue');
        temperatureInput.addEventListener('input', (e) => {
          params.temperature = parseInt(e.target.value);
          temperatureValue.textContent = params.temperature;
        });

        const showBondsCheckbox = document.getElementById('showBonds');
        showBondsCheckbox.addEventListener('change', (e) => {
          params.showBonds = e.target.checked;
        });
      },

      populateElementSelects() {
        const selects = [
          document.getElementById('element1Select'),
          document.getElementById('element2Select'),
          document.getElementById('element3Select')
        ];

        selects.forEach((select, index) => {
          select.innerHTML = '';
          elementsData.forEach(element => {
            const option = document.createElement('option');
            option.value = element.symbol;
            option.textContent = `${element.name} (${element.symbol})`;
            select.appendChild(option);
          });

          // Set default selections
          if (selectedElements[index]) {
            select.value = selectedElements[index].symbol;
          }
        });
      },

      setupOverlay() {
        this.playButton.addEventListener('click', () => {
          Simulation.play();
          this.hideOverlay();
        });

        this.resetButton.addEventListener('click', () => {
          Simulation.reset();
          this.showOverlay();
        });
      },

      setupCanvas() {
        const canvas = document.getElementById('simulationCanvas');

        // Support both click and touch events
        const pauseSimulation = () => {
          Simulation.pause();
          this.showOverlay();
        };

        canvas.addEventListener('click', pauseSimulation);
        canvas.addEventListener('touchstart', (e) => {
          e.preventDefault(); // Prevent double-firing on mobile
          pauseSimulation();
        });
      },

      showOverlay() {
        this.overlay.classList.add('active');
      },

      hideOverlay() {
        this.overlay.classList.remove('active');
      }
    };

    // Initialize everything on page load
    window.addEventListener('DOMContentLoaded', async () => {
      // Load elements from CSV first
      await loadElements();

      const canvas = document.getElementById('simulationCanvas');
      Simulation.init(canvas, params);
      UIController.init();
    });
  </script>

  <script src="../../assets/js/main.js"></script>
</body>
</html>
